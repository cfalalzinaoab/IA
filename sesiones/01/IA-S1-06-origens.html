<!doctype html>
<!--
A6 · D'on surt una resposta.
Sense xifres estadístiques ni mesures de models comercials.
Esquema didàctic: entrenament/pesos, context, recuperació web i documents.
Font primària per a respostes fonamentades en documents i cites de NotebookLM:
https://blog.google/innovation-and-ai/technology/ai/notebooklm-google-ai/
La denominació «Gemini Notebook (NotebookLM)» és la demanada al guió del curs;
no s'afirma que sigui un canvi de nom oficial del producte.
La conversa pot contenir fonts enganxades, però no implica cites automàtiques.
El resum marca els enllaços/cites retornats pels modes web i documents.
Una cita no verifica automàticament que el fragment sostingui la resposta.
Els traços de la resposta són un esquema, no una interfície de producte ni
una resposta factual. Les fonts i el context poden combinar-se.
Material docent local, versió 2 (redisseny visual). Totes les dades il·lustratives es marquen en pantalla.
v4 (13-10-2026): llum. Conductes de neó del color de l'origen (blau a la pregunta; ambre, blau i verd als orígens amb font; els pesos, sense llum), medalla del model amb halo blau i encesa, medalles dels orígens amb halo del seu color, fitxes «Enllaç a la font» / «Cita del document» amb halo verd, segells «Font comprovable» que s'encenen en verd en estampar-se, reflex sobre la llosa del model; al fons, les cintes amb brillantor de setí.
Ritme (13-10-2026): carrega IA-S1-ritme.js al <head>; tot el moviment va més a poc a poc, pel mateix factor (LENT, a IA-S1-ritme.js).
-->
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D'on surt una resposta?</title><style>
/* Base mínima: el fondo, la capçalera, el peu i els components comuns són a IA-S1-estil.css. */
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}

/* ---------- Colors de cada origen ----------
   --oc text/icona · --oe anell · --os fons clar · --edge cantell de la llosa · --tc/--td/--tl con (cos, ombra, llum) del conducte */
.o0{--oc:var(--ink);--oe:rgba(21,23,28,.55);--os:#E8E4DA;--edge:#C4BCA8;--tc:#7B7F89;--td:#4A4E57;--tl:#C3C7D0}
.o1{--oc:var(--amber);--oe:var(--amber);--os:var(--amber-soft);--edge:#E2B35C;--tc:#E6A92F;--td:#A56A08;--tl:#FAD98F}
.o2{--oc:var(--blue);--oe:var(--blue);--os:var(--blue-soft);--edge:#9DB1F2;--tc:#4A6FE0;--td:#2240A6;--tl:#B1C3F8}
.o3{--oc:var(--green);--oe:var(--green);--os:var(--green-soft);--edge:#86C8A9;--tc:#2AA37C;--td:#0D5F45;--tl:#98DCC1}

/* ---------- Gruix: pila de ombres dures (cantell) + ombra de contacte ----------
   .xNN = gruix en px. La cara és el que es llegeix; el cantell cau cap avall i a la dreta, la llum ve de dalt a l'esquerra. */
.slab{--e1:color-mix(in srgb,var(--edge) 78%,#fff);--e3:color-mix(in srgb,var(--edge) 80%,#000)}
.x14{--ext:2px 2px 0 var(--e1),4px 4px 0 var(--e1),6px 6px 0 var(--edge),8px 8px 0 var(--edge),10px 10px 0 var(--e3),12px 12px 0 var(--e3),14px 14px 0 var(--e3),16px 16px 0 rgba(21,23,28,.14);--extx:2.8px 0 0 var(--e1),5.7px 0 0 var(--e1),8.5px 0 0 var(--edge),11.3px 0 0 var(--edge),14.1px 0 0 var(--e3),17.0px 0 0 var(--e3),19.8px 0 0 var(--e3),22.6px 0 0 rgba(21,23,28,.14);--gnd:14px 20px 22px -10px rgba(21,23,28,.34)}
.x18{--ext:2px 2px 0 var(--e1),4px 4px 0 var(--e1),6px 6px 0 var(--edge),8px 8px 0 var(--edge),10px 10px 0 var(--edge),12px 12px 0 var(--edge),14px 14px 0 var(--e3),16px 16px 0 var(--e3),18px 18px 0 var(--e3),20px 20px 0 rgba(21,23,28,.14);--extx:2.8px 0 0 var(--e1),5.7px 0 0 var(--e1),8.5px 0 0 var(--edge),11.3px 0 0 var(--edge),14.1px 0 0 var(--edge),17.0px 0 0 var(--edge),19.8px 0 0 var(--e3),22.6px 0 0 var(--e3),25.5px 0 0 var(--e3),28.3px 0 0 rgba(21,23,28,.14);--gnd:22px 30px 30px -14px rgba(21,23,28,.36)}
.x20{--ext:2px 2px 0 var(--e1),4px 4px 0 var(--e1),6px 6px 0 var(--e1),8px 8px 0 var(--edge),10px 10px 0 var(--edge),12px 12px 0 var(--edge),14px 14px 0 var(--edge),16px 16px 0 var(--e3),18px 18px 0 var(--e3),20px 20px 0 var(--e3),22px 22px 0 rgba(21,23,28,.14);--extx:2.8px 0 0 var(--e1),5.7px 0 0 var(--e1),8.5px 0 0 var(--e1),11.3px 0 0 var(--edge),14.1px 0 0 var(--edge),17.0px 0 0 var(--edge),19.8px 0 0 var(--edge),22.6px 0 0 var(--e3),25.5px 0 0 var(--e3),28.3px 0 0 var(--e3),31.1px 0 0 rgba(21,23,28,.14);--gnd:26px 34px 32px -16px rgba(21,23,28,.36)}
.x24{--ext:2px 2px 0 var(--e1),4px 4px 0 var(--e1),6px 6px 0 var(--e1),8px 8px 0 var(--edge),10px 10px 0 var(--edge),12px 12px 0 var(--edge),14px 14px 0 var(--edge),16px 16px 0 var(--edge),18px 18px 0 var(--e3),20px 20px 0 var(--e3),22px 22px 0 var(--e3),24px 24px 0 var(--e3),26px 26px 0 rgba(21,23,28,.14);--extx:2.8px 0 0 var(--e1),5.7px 0 0 var(--e1),8.5px 0 0 var(--e1),11.3px 0 0 var(--edge),14.1px 0 0 var(--edge),17.0px 0 0 var(--edge),19.8px 0 0 var(--edge),22.6px 0 0 var(--edge),25.5px 0 0 var(--e3),28.3px 0 0 var(--e3),31.1px 0 0 var(--e3),33.9px 0 0 var(--e3),36.8px 0 0 rgba(21,23,28,.14);--gnd:30px 40px 36px -18px rgba(21,23,28,.40)}
.x46{--ext:2px 2px 0 var(--e1),4px 4px 0 var(--e1),6px 6px 0 var(--e1),8px 8px 0 var(--e1),10px 10px 0 var(--e1),12px 12px 0 var(--e1),14px 14px 0 var(--edge),16px 16px 0 var(--edge),18px 18px 0 var(--edge),20px 20px 0 var(--edge),22px 22px 0 var(--edge),24px 24px 0 var(--edge),26px 26px 0 var(--edge),28px 28px 0 var(--edge),30px 30px 0 var(--edge),32px 32px 0 var(--edge),34px 34px 0 var(--e3),36px 36px 0 var(--e3),38px 38px 0 var(--e3),40px 40px 0 var(--e3),42px 42px 0 var(--e3),44px 44px 0 var(--e3),46px 46px 0 var(--e3),48px 48px 0 rgba(21,23,28,.14);--extx:2.8px 0 0 var(--e1),5.7px 0 0 var(--e1),8.5px 0 0 var(--e1),11.3px 0 0 var(--e1),14.1px 0 0 var(--e1),17.0px 0 0 var(--e1),19.8px 0 0 var(--edge),22.6px 0 0 var(--edge),25.5px 0 0 var(--edge),28.3px 0 0 var(--edge),31.1px 0 0 var(--edge),33.9px 0 0 var(--edge),36.8px 0 0 var(--edge),39.6px 0 0 var(--edge),42.4px 0 0 var(--edge),45.2px 0 0 var(--edge),48.1px 0 0 var(--e3),50.9px 0 0 var(--e3),53.7px 0 0 var(--e3),56.6px 0 0 var(--e3),59.4px 0 0 var(--e3),62.2px 0 0 var(--e3),65.0px 0 0 var(--e3),67.9px 0 0 rgba(21,23,28,.14);--gnd:54px 66px 44px -22px rgba(21,23,28,.44)}
.xu16{--ext:2px -2px 0 var(--e1),4px -4px 0 var(--e1),6px -6px 0 var(--edge),8px -8px 0 var(--edge),10px -10px 0 var(--edge),12px -12px 0 var(--e3),14px -14px 0 var(--e3),16px -16px 0 var(--e3),18px -18px 0 rgba(21,23,28,.14);--gnd:0 0 0 0 transparent}

/* ---------- Peces de l'escena (tot posicionat dins #scene, 1776×612) ---------- */
#scene>*{position:absolute}

/* Icones: relleu (llum a dalt a l'esquerra, ombra a baix a la dreta) */
.ic{display:block;fill:none;stroke:var(--oc,var(--ink));stroke-width:4px;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(-1.5px -1.5px 0 rgba(255,255,255,.95)) drop-shadow(2px 2.5px 0 rgba(21,23,28,.22))}
.ic .knob{fill:var(--os)}
/* Medalla: disc amb vora, cantell i relleu */
.tile{--ed:color-mix(in srgb,var(--oc) 34%,#D3CCBA);width:144px;height:144px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 24%,#fff 0,var(--os) 46%,color-mix(in srgb,var(--os) 80%,var(--oc)) 100%);
  box-shadow:inset 0 0 0 6px rgba(255,255,255,.72),inset 0 0 0 8px color-mix(in srgb,var(--oc) 24%,transparent),inset 0 -8px 12px rgba(21,23,28,.10),
    0 8px 0 var(--ed),0 10px 0 rgba(21,23,28,.12),0 22px 18px -8px rgba(21,23,28,.42)}

/* La pregunta: bafarada de xat, llosa amb cua */
.bubble{--edge:#C9C2AE;background:var(--surface-grad);border:2px solid rgba(21,23,28,.07);border-radius:36px;transform-origin:50% 100%;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.95),var(--ext),var(--gnd);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:0 48px;
  font-weight:600;line-height:1.16;letter-spacing:-.01em;color:var(--ink)}
.bubble::after{content:"";position:absolute;left:62px;bottom:-15px;width:32px;height:32px;background:#FAF8F3;border-radius:0 0 9px 0;
  transform:rotate(45deg);box-shadow:var(--extx)}
.bubble.xl{font-size:64px}
.bubble.sm{font-size:52px}

/* El model de llenguatge: la llosa més gruixuda i més alta */
.model{--edge:#8FA6EF;background:linear-gradient(180deg,#EDF1FF 0%,#DAE2FF 100%);border:4px solid color-mix(in srgb,var(--blue) 42%,transparent);border-radius:var(--radius);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.95),var(--ext),var(--gnd);
  display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 24px 0}
.model .tile{--os:#fff;--oc:var(--blue)}
.model h2{margin:24px 0 0;font-family:var(--font-display);font-weight:700;letter-spacing:-.015em;line-height:1.08;font-size:56px}
.model.xl{justify-content:center;padding:0 32px}
.model.xl .tile{width:120px;height:120px}
.model.xl h2{font-size:60px;margin-top:24px}

/* L'origen */
.origin{background:var(--surface-grad);border-radius:var(--radius);box-shadow:inset 0 0 0 4px var(--oe),var(--ext),var(--gnd);
  display:flex;flex-direction:column;align-items:center;text-align:center}
.origin h2{margin:0;font-family:var(--font-display);font-weight:700;letter-spacing:-.015em;line-height:1.1;font-size:52px;white-space:nowrap}
.origin .detail{font-size:40px;line-height:1.2;color:var(--ink)}
.origin .tool{font-size:32px;line-height:1.2;font-weight:600;color:var(--muted)}
.origin.flow{padding:26px 16px 0}
.origin.flow h2{margin-top:16px}
.origin.flow .detail{margin-top:8px}
.origin.flow .tool{margin-top:8px}

/* Pas 6: plaques de peu sobre una peanya; el cantell puja cap a la dreta (es veu la vora de dalt) */
.pw{transform-origin:0 50%}
.pw.r{transform-origin:100% 50%}
.origin.sum{position:absolute;left:0;right:0;top:14px;height:490px;padding:28px 16px 0;z-index:1}
.origin.sum h2{margin-top:16px;height:112px;display:flex;align-items:center;justify-content:center;white-space:normal}
.origin.sum .detail{margin-top:6px}
.peana{position:absolute;left:-12px;right:-12px;top:486px;height:50px;border-radius:16px;--edge:#BDB5A1;
  background:linear-gradient(180deg,color-mix(in srgb,var(--os) 50%,#fff),color-mix(in srgb,var(--os) 100%,#DDD6C4));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.95),var(--ext),var(--gnd)}
/* El segell «Font comprovable»: en relleu, amb doble anell i cantell */
.seal{position:absolute;left:18px;right:18px;bottom:24px;height:84px;white-space:nowrap;border-radius:42px;display:flex;align-items:center;justify-content:center;gap:12px;
  background:radial-gradient(130% 170% at 28% 10%,#36C196 0,#16805E 54%,#0E694C 100%);color:#fff;font-size:34px;font-weight:700;letter-spacing:0;line-height:1;
  transform:rotate(-2deg);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.42),inset 0 -5px 0 rgba(0,0,0,.2),0 0 0 4px #fff,0 0 0 7px #16805E,
    2px 3px 0 7px #0F6247,4px 6px 0 7px #0C5640,6px 9px 0 7px #0B4F3A,16px 24px 20px 1px rgba(21,23,28,.34),0 0 18px 4px rgba(22,128,94,.46)}
.seal::before{content:"";position:absolute;inset:7px;border-radius:36px;border:2px dashed rgba(255,255,255,.55);pointer-events:none}
.seal svg{width:38px;height:38px;flex:none;fill:none;stroke:#fff;stroke-width:5px;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(1.5px 2px 0 rgba(0,0,0,.28))}

/* La resposta: full de paper amb gruix; les línies són solcs */
.reply{--edge:#D6CEBB;background:var(--surface-grad);border:2px solid var(--line);border-radius:var(--radius);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.95),var(--ext),var(--gnd);
  padding:30px 36px 30px;display:flex;flex-direction:column}
.reply h2{margin:0;font-family:var(--font-display);font-weight:700;letter-spacing:-.015em;line-height:1.1;font-size:48px}
.lines{display:flex;flex-direction:column;gap:16px;margin-top:22px}
.lines i{display:block;height:14px;border-radius:7px;background:rgba(21,23,28,.09);transform-origin:left center;
  box-shadow:inset 0 3px 4px rgba(21,23,28,.24),0 2px 0 rgba(255,255,255,.95)}
/* L'enllaç o la cita: fitxa en relleu */
.ref{--edge:#86C8A9;margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:14px;padding:8px 18px 8px 14px;border-radius:16px;
  background:linear-gradient(180deg,#EAF8F1,var(--green-soft));border:2px solid color-mix(in srgb,var(--green) 28%,transparent);
  font-size:40px;font-weight:600;line-height:1.1;color:var(--ink);box-shadow:var(--key)}
.ref svg{width:44px;height:44px;flex:none;fill:none;stroke:var(--green);stroke-width:4px;stroke-linecap:round;stroke-linejoin:round}
.ref span{text-decoration:underline;text-decoration-color:var(--green);text-decoration-thickness:5px;text-underline-offset:9px;text-decoration-skip-ink:none}

/* Conductes (fletxes amb volum): ombra, cos fosc, cos, llum; el con és de dues cares */
.links{left:0;top:0;width:1776px;height:612px;overflow:visible;pointer-events:none}
.links g{--c:#7B7F89;--d:#4A4E57;--l:#C3C7D0}
.links g.src{--c:var(--tc);--d:var(--td);--l:var(--tl)}
.links .ln{fill:none;stroke-linecap:round;stroke-linejoin:round}
.links .sh{stroke:rgba(21,23,28,.26);stroke-width:22px;transform:translate(7px,12px);filter:blur(3px)}
.links .dk{stroke:var(--d);stroke-width:22px}
.links .bd{stroke:var(--c);stroke-width:16px;transform:translate(-2px,-2px)}
.links .hl{stroke:var(--l);stroke-width:5px;transform:translate(-5px,-5px);opacity:.9}
.links .hd{transform-box:fill-box;transform-origin:50% 50%}
.links .hd path{stroke-linejoin:round;stroke-width:7px}
.links .hs{fill:rgba(21,23,28,.26);stroke:rgba(21,23,28,.26);transform:translate(7px,12px);filter:blur(3px)}
.links .hf{fill:var(--l);stroke:none}
.links .hb{fill:var(--d);stroke:var(--d)}


/* ---------- v4 · Llum ----------
   Brilla lo que emite, con el color de su origen: el modelo (azul), cada origen con fuente (ámbar, azul, verde) y lo comprobable (verde).
   Los pesos (o0) no brillan: no hay fuente. --og = rgb del origen. Los halos fijos están en el estado final;
   los destellos (data-encen) y el reflejo (data-reflex) solo corren al avanzar. */
.o1{--og:201,133,18}.o2{--og:47,85,212}.o3{--og:22,128,94}
.tile{--tb:inset 0 0 0 6px rgba(255,255,255,.72),inset 0 0 0 8px color-mix(in srgb,var(--oc) 24%,transparent),inset 0 -8px 12px rgba(21,23,28,.10),0 8px 0 var(--ed),0 10px 0 rgba(21,23,28,.12),0 22px 18px -8px rgba(21,23,28,.42)}
.model .tile{--og:47,85,212}
.model .tile,.o1 .tile,.o2 .tile,.o3 .tile{box-shadow:var(--tb),inset 0 0 22px rgba(var(--og),.24),0 0 18px 4px rgba(var(--og),.64),0 0 44px 8px rgba(var(--og),.26)}
.model{box-shadow:inset 0 3px 0 rgba(255,255,255,.95),var(--ext),var(--gnd),0 0 40px 3px rgba(47,85,212,.28),0 44px 60px -26px rgba(47,85,212,.55)}
.model[data-reflex]::after{mix-blend-mode:overlay}
.origin.flow.o1,.origin.flow.o2,.origin.flow.o3{box-shadow:inset 0 0 0 4px var(--oe),var(--ext),var(--gnd),0 0 36px 4px rgba(var(--og),.38),0 44px 56px -24px rgba(var(--og),.52)}
.ref{box-shadow:var(--key),0 18px 30px -8px rgba(22,128,94,.38),0 0 14px 2px rgba(22,128,94,.48),0 0 34px 5px rgba(22,128,94,.20)}
/* conductos de neón: halo desenfocado (copia del trazo) + cuerpo vivo + núcleo claro centrado */
.links .gl{display:none;stroke:rgba(var(--og,47,85,212),.95);stroke-width:46px;filter:blur(12px)}
.links g.neon .gl{display:inline}
.links g.neon .hl{stroke:#fff;transform:none;stroke-width:5px;opacity:1}
.links g.neon .hd{--d:var(--td,#2240A6);--l:var(--tl,#B1C3F8);filter:drop-shadow(0 0 8px rgba(var(--og,47,85,212),.9))}
.links g.blue{--c:#4A6FE0;--d:#2240A6;--l:#B1C3F8;--og:47,85,212}

/* Fons: cintes retorçades en perspectiva, a banda i banda i a dalt a la dreta; s'esvaeixen cap al contingut */
#fons{opacity:.86;filter:blur(4px) saturate(1.05);
  -webkit-mask-image:radial-gradient(ellipse 1080px 640px at 48% 58%,transparent 52%,rgba(0,0,0,.7) 74%,#000 100%);
          mask-image:radial-gradient(ellipse 1080px 640px at 48% 58%,transparent 52%,rgba(0,0,0,.7) 74%,#000 100%)}
#fons .cinta{position:absolute;inset:0;width:1920px;height:1080px;overflow:visible;
  filter:drop-shadow(20px 30px 22px rgba(21,23,28,.20));
  transform:translate3d(calc(var(--p,0) * var(--k,0) * 1px),calc(var(--p,0) * var(--ky,0) * 1px),var(--z,0px));transition:transform 1.2s var(--ease)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current=0, totalSteps=1, drawStep, generation=0;
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const EASE='cubic-bezier(.2,.8,.2,1)';
function motion(el,frames,options={}){if(!el||reduced())return null;return el.animate(frames,{duration:600,easing:EASE,fill:'both',...options});}
/* Pinta la escena. Només la frase de sota s'anima: dins l'escena, cada peça decideix el seu moviment. */
function show(html,caption='',note='',stamp='',animate=true){
 $('#scene').innerHTML=html;$('#caption').textContent=caption;$('#note').textContent=note;$('#stamp').textContent=stamp;
 if(animate&&caption)motion($('#caption'),[{opacity:.4,transform:'translateY(10px)'},{opacity:1,transform:'translateY(0)'}],{duration:520,fill:'backwards'});
}
function resize(){const s=Math.min(innerWidth/1920,innerHeight/1080);const stage=$('#stage');stage.style.transform=`scale(${s})`;stage.style.left=`${(innerWidth-1920*s)/2}px`;stage.style.top=`${(innerHeight-1080*s)/2}px`;}
function go(n){const next=Math.max(0,Math.min(totalSteps-1,n));if(next===current&&generation)return;const prev=current;current=next;generation++;document.getAnimations().forEach(a=>a.cancel());drawStep(current,prev);$('#counter').textContent=`${current+1}/${totalSteps}`;$('#prev').disabled=current===0;$('#next').disabled=current===totalSteps-1;document.body.dataset.step=String(current+1);}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){$('#note').textContent=TEXTOS.fullscreenError;}}
function boot(total,renderer){totalSteps=total;drawStep=renderer;document.title=TEXTOS.title;$('#title').textContent=TEXTOS.title;$('#course').textContent=TEXTOS.course;$('#help').textContent=TEXTOS.help;$('#index').textContent=TEXTOS.index;$('#prev').ariaLabel=TEXTOS.previous;$('#next').ariaLabel=TEXTOS.next;$('#full').ariaLabel=TEXTOS.full;$('#prev').textContent=TEXTOS.prevSymbol;$('#next').textContent=TEXTOS.nextSymbol;$('#full').textContent=TEXTOS.fullSymbol;
 $('#prev').onclick=e=>{e.stopPropagation();go(current-1)};$('#next').onclick=e=>{e.stopPropagation();go(current+1)};$('#full').onclick=e=>{e.stopPropagation();fullscreen()};
 $('#stage').onclick=e=>{if(e.target.closest('button,a,input,select,[data-interactive]'))return;go(current+1)};
 addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.target.closest('input,textarea,select'))return;let handled=true;if(['ArrowRight',' ','PageDown'].includes(e.key))go(current+1);else if(['ArrowLeft','PageUp'].includes(e.key))go(current-1);else if(e.key==='Home'){generation=0;go(0)}else if(e.key.toLowerCase()==='f')fullscreen();else handled=false;if(handled)e.preventDefault()});
 addEventListener('resize',resize);resize();go(0);
 window.presentation={go,next:()=>go(current+1),previous:()=>go(current-1),get step(){return current+1},get total(){return totalSteps},get generation(){return generation}};
}

/* ================= A6 · peces ================= */
const KINDS=['weights','conversation','web','documents'];
/* Icones de 96×96, traç de 4 px */
const ICONS={
 weights:'<path d="M24 12V84M48 12V84M72 12V84"/><circle class="knob" cx="24" cy="62" r="10"/><circle class="knob" cx="48" cy="34" r="10"/><circle class="knob" cx="72" cy="52" r="10"/>',
 conversation:'<path d="M20 14H76a8 8 0 0 1 8 8V58a8 8 0 0 1-8 8H44L28 82V66H20a8 8 0 0 1-8-8V22a8 8 0 0 1 8-8Z"/><path d="M28 34H68M28 48H54"/>',
 web:'<circle cx="48" cy="48" r="36"/><ellipse cx="48" cy="48" rx="15" ry="36"/><path d="M12 48H84"/>',
 documents:'<path d="M20 32a4 4 0 0 1 4-4H50L66 44V84a4 4 0 0 1-4 4H24a4 4 0 0 1-4-4Z"/><path d="M50 28V44H66M32 62H54M32 74H54"/><path d="M32 28V16a4 4 0 0 1 4-4H62L78 28V68a4 4 0 0 1-4 4H66"/><path d="M62 12V28H78"/>',
 model:'<path d="M16 48L48 20L80 48L48 76ZM48 20V76"/><circle class="knob" cx="16" cy="48" r="9"/><circle class="knob" cx="48" cy="20" r="9"/><circle class="knob" cx="80" cy="48" r="9"/><circle class="knob" cx="48" cy="76" r="9"/>'
};
const icon=k=>`<svg class="ic" viewBox="0 0 96 96" width="96" height="96" aria-hidden="true">${ICONS[k]}</svg>`;
const tile=(k,llum,d)=>`<div class="tile"${llum?` data-encen data-llum="${llum}" style="--d:${d}ms"`:''}>${icon(k)}</div>`;
const LINK_ICON='<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M20 28a8 8 0 0 0 11 0l7-7a8 8 0 0 0-11-11l-3 3"/><path d="M28 20a8 8 0 0 0-11 0l-7 7a8 8 0 0 0 11 11l3-3"/></svg>';
const DOC_ICON='<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M12 8H27L38 19V38a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2Z"/><path d="M27 8V19H38M18 28H30M18 34H30"/></svg>';
const CHECK='<svg viewBox="0 0 40 40" aria-hidden="true"><path class="tick" d="M7 21L16 30L33 10"/></svg>';
const place=(l,t,w,h)=>`left:${l}px;top:${t}px;width:${w}px;height:${h}px`;

/* Geometria dels passos 2 a 5 (coordenades de #scene). Les llosses tenen gruix cap avall i a la dreta:
   origen i resposta 24 i 20 px, model 46 px (més alt); totes acaben a la mateixa base, y≈596. */
const G={q:place(348,0,1080,96),o:place(0,208,530,364),m:place(684,184,400,366),r:place(1240,208,516,364)};

function bubble(cls,style){return `<div class="bubble slab ${cls}" style="${style}">${esc(TEXTOS.question)}</div>`;}
/* Conducte amb volum: la línia (ombra, cos fosc, cos, llum) i el con (dues cares) van per separat
   perquè la línia es pugui dibuixar i el con aparegui al final */
function arrow(x1,y1,x2,y2,cls=''){
 const v=x1===x2,L=40,W=34;
 const A=v?[x2-W,y2-L]:[x2-L,y2-W],B=v?[x2+W,y2-L]:[x2-L,y2+W],T=[x2,y2],M=v?[x2,y2-L]:[x2-L,y2];
 const P=a=>a.join(' ');
 const tri=`M${P(A)}L${P(T)}L${P(B)}Z`,lit=`M${P(A)}L${P(T)}L${P(M)}Z`,d=`M${x1} ${y1}L${x2} ${y2}`;
 return `<g class="${cls}"><path class="ln sh" d="${d}"/><path class="ln gl" d="${d}"/><path class="ln dk" d="${d}"/><path class="ln bd" d="${d}"/><path class="ln hl" d="${d}"/>`+
  `<g class="hd"><path class="hs" d="${tri}"/><path class="hb" d="${tri}"/><path class="hf" d="${lit}"/></g></g>`;
}
function replyCard(i,dr=0){
 const ref=i>=2?`<div class="ref" data-encen data-llum="green" style="--d:${dr}ms">${i===2?LINK_ICON:DOC_ICON}<span>${esc(i===2?TEXTOS.link:TEXTOS.citation)}</span></div>`:'';
 return `<section class="reply slab x20" style="${G.r}"><h2>${esc(TEXTOS.response)}</h2><div class="lines" aria-hidden="true"><i style="width:100%"></i><i style="width:92%"></i><i style="width:100%"></i><i style="width:78%"></i><i style="width:56%"></i></div>${ref}</section>`;
}
const LLUM=['','amber','blue','green'];
function originFlow(i,dt=0){
 const k=KINDS[i];
 return `<section class="origin flow slab x24 o${i}" style="${G.o}">${tile(k,LLUM[i],dt)}<h2>${esc(TEXTOS.origins[i])}</h2><div class="detail">${esc(TEXTOS.details[i])}</div>${i===3?`<div class="tool">${esc(TEXTOS.tool)}</div>`:''}</section>`;
}
/* Pas 6: quatre plaques de peu sobre una peanya, un pèl girades cap al centre (origen a la vora exterior) */
function originSum(i){
 const k=KINDS[i];
 const w=408,gap=36,left=14+i*(w+gap),rot=[7,3,-3,-7][i];
 const seal=i>=2?`<div class="seal" data-encen data-llum="green" style="--d:${1280+(i-2)*220}ms">${CHECK}<span>${esc(TEXTOS.checkable)}</span></div>`:'';
 return `<div class="pw${i>1?' r':''} o${i}" style="${place(left,8,w,552)};transform:perspective(1800px) rotateY(${rot}deg)">`+
  `<i class="peana slab x14"></i>`+
  `<section class="origin sum slab xu16">${tile(k)}<h2>${esc(TEXTOS.origins[i])}</h2><div class="detail">${esc(TEXTOS.summaryDetails[i])}</div>${seal}</section></div>`;
}

/* Animacions: es dibuixa el que és nou; el que ja hi era no es mou */
function enter(el,delay=0,dx=0,dy=0,duration=560){motion(el,[{opacity:0,transform:`translate(${dx}px,${dy}px)`},{opacity:1,transform:'translate(0px,0px)'}],{duration,delay,fill:'backwards'});}
/* Una peça «cau» sobre la taula: gira des de la vora de baix (transform-origin: 50% 100%) */
function drop(el,delay=0,duration=640){motion(el,[{opacity:0,transform:'perspective(1400px) rotateX(-55deg) translateY(-12px)'},{opacity:1,transform:'none'}],{duration,delay,fill:'backwards'});}
function trace(path,delay=0,duration=450){if(!path||reduced())return;const L=path.getTotalLength();motion(path,[{strokeDasharray:`${L} ${L}`,strokeDashoffset:L,opacity:0},{strokeDasharray:`${L} ${L}`,strokeDashoffset:L,opacity:1,offset:.03},{strokeDasharray:`${L} ${L}`,strokeDashoffset:0,opacity:1}],{duration,delay,fill:'backwards'});}
function drawArrow(g,delay=0,duration=420){if(!g)return;g.querySelectorAll('.ln').forEach(p=>trace(p,delay,duration));motion(g.querySelector('.hd'),[{opacity:0,scale:.55},{opacity:1,scale:1}],{duration:200,delay:delay+duration*.82,fill:'backwards'});}
function grow(el,delay=0,duration=520){motion(el,[{transform:'scaleX(.05)',opacity:.3},{transform:'scaleX(1)',opacity:1}],{duration,delay,fill:'backwards'});}
function pop(el,delay=0,duration=520){motion(el,[{opacity:0,scale:.7},{opacity:1,scale:1}],{duration,delay,fill:'backwards',easing:'cubic-bezier(.3,1.5,.5,1)'});}

function renderStep(step,prev=0){
 const animate=step>=prev;           // en retrocedir, estat final sense moure res
 if(step===0){
  // Pas 1: la pregunta, en gran, entra al model pel conducte
  show(
   `<svg class="links" viewBox="0 0 1776 612" aria-hidden="true">${arrow(1010,290,1100,290,'a1 neon blue')}</svg>`+
   bubble('xl x18',place(100,118,880,360))+
   `<section class="model xl slab x46" data-reflex style="${place(1112,104,530,346)};--dr:760ms">${tile('model','blue',1200)}<h2>${esc(TEXTOS.model)}</h2></section>`,
   TEXTOS.captions[0],TEXTOS.notes[0],'',animate);
  if(animate){
   enter($('.model'),0,0,30,620);
   drop($('.bubble'),160,680);
   drawArrow($('.a1'),640,440);
   pop($('.model .tile'),980,560);
  }
  return;
 }
 if(step<5){
  // Passos 2 a 5: mateixa composició; només canvia l'origen
  const i=step-1;
  const oldCard=(animate&&prev>=1&&prev<step&&!reduced())?$('.origin'):null;   // l'origen anterior, per fer-lo desaparèixer suaument
  const oldHTML=oldCard?oldCard.outerHTML:'';
  const first=prev<1,t0=first?340:0,dOrg=t0+(oldHTML?120:0);   // mismos retardos que las entradas de abajo
  show(
   `<svg class="links o${i}" viewBox="0 0 1776 612" aria-hidden="true">`+
    arrow(884,116,884,174,'aq')+
    arrow(566,390,670,390,i>0?'src neon':'src')+
    arrow(1144,390,1228,390,'ar')+
   `</svg>`+
   bubble('sm x14',G.q)+
   `<section class="model slab x46" style="${G.m}">${tile('model')}<h2>${esc(TEXTOS.model)}</h2></section>`+
   replyCard(i,t0+1180)+originFlow(i,dOrg+560),
   TEXTOS.captions[step],TEXTOS.notes[step],'',animate);
  if(oldHTML){
   const tmp=document.createElement('div');tmp.innerHTML=oldHTML;
   const ghost=tmp.firstElementChild;ghost.style.pointerEvents='none';
   ghost.querySelectorAll('[data-encen],[data-reflex]').forEach(e=>{e.removeAttribute('data-encen');e.removeAttribute('data-reflex');});   // el fantasma no vuelve a destellar
   $('#scene').appendChild(ghost);
   const fade=ghost.animate([{opacity:1},{opacity:0}],{duration:260,easing:'ease-out',fill:'forwards'});
   fade.onfinish=()=>ghost.remove();
  }
  if(animate){
   // first: ve del pas 1, la composició apareix sencera
   if(first){
    drop($('.bubble'),0,620);
    enter($('.model'),90,0,28,560);
    enter($('.reply'),180,28,0,560);
    drawArrow($('.aq'),260,360);
   }
   enter($('.origin'),t0+(oldHTML?120:0),-48,0,600);
   drawArrow($('.src'),t0+240,400);
   drawArrow($('.ar'),t0+480,400);
   document.querySelectorAll('.lines i').forEach((el,k)=>grow(el,t0+620+k*60,480));
   enter($('.ref'),t0+900,0,12,480);
   if(i===0)document.querySelectorAll('.origin .knob').forEach((c,k)=>motion(c,[{translate:`0 ${[-26,24,-18][k]}px`},{translate:'0 0px'}],{duration:760,delay:t0+160+k*120,fill:'backwards'}));
  }
  return;
 }
 // Pas 6: els quatre orígens, un al costat de l'altre, com a plaques de peu
 show(KINDS.map((_,i)=>originSum(i)).join(''),TEXTOS.captions[5],TEXTOS.notes[5],'',animate);
 if(animate){
  document.querySelectorAll('.pw').forEach((el,i)=>{
   const d=i*110;
   enter(el.querySelector('.peana'),d,0,22,480);
   enter(el.querySelector('.origin'),d+150,0,-70,620);
  });
  document.querySelectorAll('.seal').forEach((el,k)=>{
   const d=980+k*220;
   motion(el,[{opacity:0,scale:1.7},{opacity:1,scale:1}],{duration:520,delay:d,fill:'backwards',easing:'cubic-bezier(.3,1.3,.5,1)'});
   trace(el.querySelector('.tick'),d+260,420);
  });
 }
}

/* Fons temàtic (el crida IA-S1-comu.js): tres cintes retorçades —blava, corall i verda— en perspectiva.
   Cada cinta és una sèrie de quadrilàters sobre una corba; l'amplada va com el cosinus d'un gir, així es veuen les dues cares
   i el moment en què la cinta es posa de cantell. Sense text. A banda i banda i a dalt a la dreta, mai sota el text. */
window.fonsIA=function(capa){
 const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
 const mix=(a,b,t)=>{t=Math.max(0,Math.min(1,t));return [0,1,2].map(i=>Math.round(a[i]+(b[i]-a[i])*t));};
 const rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
 function spline(P,N){
  const out=[],n=P.length-1;
  for(let k=0;k<N;k++){
   const u=k/(N-1)*n,i=Math.min(n-1,Math.floor(u)),t=u-i;
   const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(n,i+2)];
   const f=j=>.5*(2*p1[j]+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t*t+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t*t*t);
   out.push([f(0),f(1)]);
  }
  return out;
 }
 function cinta(o){
  const S=spline(o.P,120),n=S.length,base=hex(o.base),light=hex(o.light),dark=hex(o.dark);
  const q=S.map((p,k)=>{
   const a=S[Math.max(0,k-1)],b=S[Math.min(n-1,k+1)];
   let tx=b[0]-a[0],ty=b[1]-a[1];const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;
   const u=k/(n-1),W=(o.w0+(o.w1-o.w0)*u)/2,c=Math.cos(o.ph+o.tw*u),hw=W*Math.max(.05,Math.abs(c));
   return {x:p[0],y:p[1],nx:-ty,ny:tx,hw,c,u};
  });
  let h='';
  for(let k=0;k<n-1;k++){
   const A=q[k],B=q[k+1],c=(A.c+B.c)/2,u=(A.u+B.u)/2;
   let col=c>=0?mix(base,light,.62*c+.12*Math.sin(u*9)):mix(dark,base,.45*(-c)+.1*Math.sin(u*9));
   if(c>0)col=mix(col,[255,255,255],Math.pow(c,7)*.62);   // v4 · brillo satinado: la cara que mira de frente refleja la luz
   const f=rgb(col);
   h+=`<path d="M${(A.x+A.nx*A.hw).toFixed(1)} ${(A.y+A.ny*A.hw).toFixed(1)}L${(B.x+B.nx*B.hw).toFixed(1)} ${(B.y+B.ny*B.hw).toFixed(1)}L${(B.x-B.nx*B.hw).toFixed(1)} ${(B.y-B.ny*B.hw).toFixed(1)}L${(A.x-A.nx*A.hw).toFixed(1)} ${(A.y-A.ny*A.hw).toFixed(1)}Z" fill="${f}" stroke="${f}" stroke-width=".8" stroke-linejoin="round"/>`;
  }
  return `<svg class="cinta" viewBox="0 0 1920 1080" style="--z:${o.z}px;--k:${o.k};--ky:${o.ky}" aria-hidden="true">${h}</svg>`;
 }
 const R=[
  /* corall: vessa pel cantó de dalt, a la dreta del títol */
  {P:[[830,-150],[1000,20],[1240,110],[1500,90],[1740,-20],[1940,-90]],w0:100,w1:160,ph:1.0,tw:5.6,base:'#E0583B',light:'#FFB9A3',dark:'#962B14',z:-260,k:14,ky:3},
  /* blau: baixa pel cantó dret */
  {P:[[1210,-180],[1500,-60],[1760,110],[1890,320],[1940,520],[2010,700],[2120,820]],w0:130,w1:210,ph:.4,tw:7.6,base:'#3F66E8',light:'#A8BDFB',dark:'#1B3592',z:-120,k:-12,ky:4},
  /* verd: puja pel cantó esquerre, per fora del text */
  {P:[[-70,1210],[-12,960],[22,740],[-26,520],[16,330],[-12,170],[-72,40]],w0:110,w1:84,ph:.2,tw:6.4,base:'#23A27A',light:'#93E2C3',dark:'#0B5C42',z:0,k:22,ky:0}
 ];
 capa.innerHTML=R.map(cinta).join('');
};

boot(6,renderStep);
