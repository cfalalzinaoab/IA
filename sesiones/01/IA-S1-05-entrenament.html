<!doctype html>
<!--

A5 · Entrenament i inferència. Guió docent proporcionat per l’encàrrec.
Sense xifres ni dates de cap model comercial. «Durant mesos», «milers» i
«milions de milions de tokens» són ordres de magnitud, no una mesura concreta.
El xip de la GPU és una quadrícula de cel·les que s’encenen per onades per
representar el paral·lelisme: és il·lustratiu i no és l’arquitectura real d’una GPU.
Les posicions i el moviment de les rodetes són il·lustratius; no expressen valors
de pesos reals.
Simplificacions visibles: exemple d’una sola paraula i un sol error; els pesos
s’actualitzen conjuntament durant l’entrenament. L’ajust per conversar agrupa
diverses tècniques. La data de tall és de les dades d’entrenament i no limita el
context ni les eines que puguin aportar informació actualitzada. La inferència
habitual no actualitza els pesos; la memòria de l’aplicació és context afegit.
Les condicions d’ús de converses per a entrenament depenen de cada compte i servei.
Referència conceptual: Vaswani et al., Attention Is All You Need (2017),
https://arxiv.org/abs/1706.03762 (model, entrenament i descodificació autoregressiva).

Material docent local, versió 2 (disseny net, 13-10-2026). Totes les dades il·lustratives es marquen en pantalla.
v3 (13-10-2026): profunditat. Rodetes i candau amb relleu, tubs com a fletxes, xip de la GPU en perspectiva, pista i barrera, interruptors físics; fons de placa de circuit (window.fonsIA).
v4 (13-10-2026): llum. Punta LED en els punters de les rodetes, botó de sincronitzar i candau amb halo i encesa en arribar, bucle i conducte coral com a neó, graella de la GPU com a LED amb resplendor (un sol filtre) i franja de llum, barrera de data de tall amb baliza coral, targeta «Ús» amb halo blau, «Text desat» amb halo blau, interruptors encesos amb halo coral; al fons, pistes i LED de la placa amb llum pròpia.
Ritme (13-10-2026): carrega IA-S1-ritme.js al <head>; tot el moviment va més a poc a poc, pel mateix factor (LENT, a IA-S1-ritme.js).
-->
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrenament i inferència</title><style>

/* ---------- v3 · Profunditat: peces comunes d'A5 (una sola llum, de dalt a l'esquerra) ---------- */
/* Rodeta: un manec físic. Anell enfonsat amb marques, cos amb brillantor i cantell, marca de color. El que gira és .ptr. */
.dial{--d:120px;--c:var(--blue);--cs:#E4EAFF;--ck:#B5C5F6;--ce:#7F98EA;--dc:47,85,212;
  position:relative;display:block;flex:none;width:var(--d);height:var(--d);border-radius:50%;
  background:radial-gradient(circle,#DAD5C7 0 58%,#EDE9DE 59% 100%);
  box-shadow:inset 0 calc(var(--d) * .03) calc(var(--d) * .07) rgba(21,23,28,.30),inset 0 calc(var(--d) * -.02) 0 rgba(255,255,255,.75),0 1px 0 rgba(255,255,255,.7)}
.dial.green{--c:var(--green);--cs:#DCF2E8;--ck:#A5D8BF;--ce:#6FB896;--dc:22,128,94}
.dial.coral{--c:var(--coral);--cs:#FFE5DC;--ck:#F4B7A3;--ce:#DE8D74;--dc:210,70,42}
.dial .tk{position:absolute;left:50%;top:50%;width:calc(var(--d) * .05);height:calc(var(--d) * .05);margin:calc(var(--d) * -.025);border-radius:50%;
  background:rgba(21,23,28,.42);transform:rotate(var(--a)) translateY(calc(var(--d) * -.43))}
.dial .kn{position:absolute;inset:17%;border-radius:50%;
  background:radial-gradient(circle at 34% 26%,#fff 0,var(--cs) 36%,var(--ck) 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.85),inset 0 -3px 5px rgba(21,23,28,.12),
    0 calc(var(--d) * .055) 0 var(--ce),0 calc(var(--d) * .075) 0 rgba(21,23,28,.14),0 calc(var(--d) * .17) calc(var(--d) * .15) calc(var(--d) * -.07) rgba(21,23,28,.5)}
.dial .ptr{position:absolute;inset:0;display:block}
.dial .ptr b{position:absolute;left:50%;top:9%;width:calc(var(--d) * .075);height:32%;margin-left:calc(var(--d) * -.0375);border-radius:99px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--c) 72%,#fff),var(--c) 55%);box-shadow:0 1px 1px rgba(21,23,28,.3)}
/* v4 · Llum: la punta del puntero es un LED (centro blanco, color del mando y halo); gira con .ptr */
.dial .ptr b::after{content:"";position:absolute;left:50%;top:0;width:calc(var(--d) * .15);height:calc(var(--d) * .15);margin:calc(var(--d) * -.075) 0 0 calc(var(--d) * -.075);border-radius:50%;
  background:radial-gradient(circle at 50% 46%,#fff 0 20%,color-mix(in srgb,var(--c) 80%,#fff) 48%,var(--c) 100%);
  box-shadow:0 0 calc(var(--d) * .12) calc(var(--d) * .03) rgba(var(--dc),.95),0 0 calc(var(--d) * .34) calc(var(--d) * .07) rgba(var(--dc),.46)}
.dial .kn u{position:absolute;left:50%;top:50%;width:19%;height:19%;margin:-9.5%;border-radius:50%;display:block;
  background:radial-gradient(circle at 34% 28%,#fff,var(--c) 62%);box-shadow:0 1px 2px rgba(21,23,28,.4)}
/* Cartutx de pesos: bandeja enfonsada amb les rodetes, i amb candau (fixos) o amb el botó d'ajust */
.wcap{display:flex;align-items:center;gap:var(--g,20px);padding:var(--p,18px 28px);border-radius:999px;
  background:linear-gradient(180deg,#D8D2C4,#E8E4D9);
  box-shadow:inset 0 5px 12px rgba(21,23,28,.22),inset 0 -2px 0 rgba(255,255,255,.8),0 1px 0 rgba(255,255,255,.7)}
.wcap.locked{background:linear-gradient(180deg,#B7DDCA,#D2ECDF)}
.wcap .sep{width:6px;height:56px;border-radius:3px;background:rgba(21,23,28,.15);flex:none;
  box-shadow:inset 0 2px 2px rgba(21,23,28,.25),0 1px 0 rgba(255,255,255,.7)}
.lock{width:var(--lw,64px);height:calc(var(--lw,64px) * 1.125);flex:none;display:block;filter:drop-shadow(0 5px 3px rgba(21,23,28,.38)) drop-shadow(0 0 4px rgba(255,255,255,.95)) drop-shadow(0 0 12px rgba(40,205,140,.80))}
.lw,.dw{display:block;flex:none}
.btn3d{display:grid;place-items:center;flex:none;width:var(--lw,64px);height:var(--lw,64px);border-radius:50%;
  background:radial-gradient(circle at 34% 26%,#fff,#E4EAFF 42%,#B5C5F6);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.85),inset 0 0 14px rgba(255,255,255,.7),0 5px 0 #7F98EA,0 7px 0 rgba(21,23,28,.12),0 14px 14px -6px rgba(21,23,28,.42),var(--glow-sm-blue)}
.sync{width:64%;height:64%;display:block;fill:none;stroke:var(--blue);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 2.5px rgba(47,85,212,.55))}
.ico{display:block;flex:none;fill:none;stroke:var(--blue);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 4px 2px rgba(21,23,28,.3))}
/* Tubs i fletxes: ombra apilada, vora fosca, cos i brillantor; cap cònic */
.arr{flex:none;display:block}
.tb path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.cone{stroke-linejoin:round;stroke-width:2.5px;filter:drop-shadow(0 4px 3px rgba(21,23,28,.42))}
.cone.neon{filter:drop-shadow(0 4px 3px rgba(21,23,28,.30)) drop-shadow(0 0 7px rgba(226,84,52,.78))}
.tb .gl{opacity:.95}
.t{font-family:var(--font-display);font-size:44px;font-weight:700;line-height:1.1;letter-spacing:-.005em}
.lbl{font-size:40px;font-weight:700;line-height:1.1}
.bubble,.piece{box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 5px 0 #D3CDBF,0 7px 0 rgba(21,23,28,.08),0 16px 18px -10px rgba(21,23,28,.35)}

#scene .col,#scene .a2 .scale,#scene .f5 .mdl,#scene .f6 .ctx,#scene .a7 .sws{box-shadow:var(--shadow-lift)}
/* v4 · Llum: luz de debajo (el color del significado sobre la mesa) en las tarjetas que importan */
#scene .col.train{box-shadow:var(--shadow-lift),0 34px 54px -24px rgba(47,85,212,.42)}
#scene .col.infer{box-shadow:var(--shadow-lift),0 34px 54px -24px rgba(22,128,94,.42)}
#scene .f5 .mdl{box-shadow:var(--shadow-lift),0 34px 54px -22px rgba(22,128,94,.44)}
#scene .f6 .mdl{box-shadow:var(--hi),0 1px 2px rgba(21,23,28,.08),0 12px 24px -12px rgba(21,23,28,.22),0 30px 48px -22px rgba(22,128,94,.40)}
/* el reflejo sobre el modelo se mezcla en «overlay»: aclara la tarjeta pero deja el texto oscuro como está */
.f5 .mdl[data-reflex]::after{mix-blend-mode:overlay}
#scene .f5 .ans{box-shadow:var(--hi),0 1px 2px rgba(21,23,28,.08),0 12px 24px -12px rgba(21,23,28,.22),0 26px 42px -22px rgba(47,85,212,.34)}

/* ---------- Pas 1: dues targetes com un llibre obert ---------- */
.cols{display:grid;grid-template-columns:864px 864px;gap:48px;height:612px}
.col{display:flex;flex-direction:column;align-items:center;text-align:center;padding:44px 40px 40px}

.col .sub{font-size:40px;color:var(--muted);margin-top:6px;line-height:1.15}
.col .model{width:100%;margin-top:32px;padding:28px 24px 32px;display:flex;flex-direction:column;align-items:center;gap:24px}
.col .desc{margin-top:auto;font-size:48px;font-weight:700;line-height:1.1}
.col .dial{--d:124px}.col .wcap{--lw:76px}

/* ---------- Pas 2 ---------- */
.a2{position:relative;width:1776px;height:612px}
.a2 .top{position:absolute;left:0;top:32px;width:1776px;height:88px;display:flex;justify-content:center;align-items:center;gap:28px;
  font-family:var(--font-display);font-size:64px;font-weight:700;letter-spacing:-.01em}

  box-shadow:inset 0 6px 12px rgba(21,23,28,.20),inset 0 -2px 0 rgba(255,255,255,.7)}
.a2 .row{position:absolute;left:0;top:140px;width:1776px;height:248px;display:grid;grid-template-columns:1fr 112px 1fr 112px 1fr;align-items:center}

#scene .a2 .c-err{box-shadow:var(--hi),0 1px 2px rgba(21,23,28,.08),0 12px 24px -12px rgba(21,23,28,.22),0 0 22px 2px rgba(210,70,42,.30),0 0 60px 8px rgba(210,70,42,.15)}
.a2 .dials{display:flex;gap:16px}.a2 .dials .dial{--d:96px}
.a2 .loop{position:absolute;left:0;top:388px;width:1776px;height:140px}

/* ---------- Pas 3: la GPU, un xip en relleu una mica inclinat ---------- */
.a3{width:1776px;height:612px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.a3 .gpuh{display:flex;align-items:center;justify-content:center;gap:36px}

  font-family:var(--font-display);font-size:88px;font-weight:700;letter-spacing:.01em;line-height:1;--edge:#1B3796;
  box-shadow:var(--key),inset 0 0 26px rgba(255,255,255,.20),var(--glow-blue)}
.a3 .x{font-family:var(--font-display);font-size:88px;font-weight:700;color:var(--coral);line-height:1}

/* v4 · LED: un solo filtro (resplandor) sobre toda la rejilla encendida */
.a3 .leds{filter:drop-shadow(0 0 3px rgba(150,185,255,.95)) drop-shadow(0 0 11px rgba(47,85,212,.70))}
.a3 .dieglow{filter:blur(17px)}
.a3 .dim rect{fill:var(--blue);fill-opacity:.16}
.a3 .band{fill:url(#gLed);opacity:.95}

/* ---------- Pas 4: una pista amb gruix i una barrera ---------- */
.a4{position:relative;width:1776px;height:612px}
.a4 .tl{position:absolute;left:0;top:0;width:1776px;height:612px}
.a4 .cutwrap{position:absolute;left:932px;width:800px;top:40px;display:flex;justify-content:center}
.a4 .cutpill{display:inline-flex;align-items:center;gap:16px;padding:12px 30px;border-radius:999px;font-size:44px;font-weight:700;line-height:1.1;letter-spacing:-.005em;
  background:var(--coral-soft);border:4px solid var(--coral);white-space:nowrap;--edge:#E39A82;box-shadow:var(--key),0 18px 30px -8px rgba(210,70,42,.34)}
.a4 .ph{position:absolute;top:176px;height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.a4 .ph .t{font-size:50px}.a4 .ph .d{font-size:40px;line-height:1.15;color:var(--muted)}
.a4 .p1{left:0;width:480px}.a4 .p2{left:568px;width:720px}.a4 .p3{left:1376px;width:400px}
#scene .a4 .p3{box-shadow:var(--shadow),var(--glow-blue),inset 0 0 26px rgba(47,85,212,.07)}

/* ---------- Passos 5 i 6 ---------- */
.flow{display:grid;align-items:center;height:612px}

.f6{grid-template-columns:440px 72px 648px 72px 544px}
.node{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:24px}

/* ---------- Pas 7: interruptors físics i un conducte amb vàlvula ---------- */
.a7{position:relative;width:1776px;height:612px}
.a7 .gate{position:absolute;left:436px;top:0;width:784px;height:612px}
.a7 .L{position:absolute;left:0;top:346px;width:420px;height:200px;display:flex;align-items:center;justify-content:center;text-align:center}

.sw{position:relative;display:block;width:152px;height:80px;border-radius:40px;

  box-shadow:inset 0 2px 0 #fff,0 5px 0 #A9A290,0 7px 0 rgba(21,23,28,.14),0 15px 12px -6px rgba(21,23,28,.5);
  transform:translateX(72px);display:flex;align-items:center;justify-content:center}

/* ---------- Fons: una placa de circuit en perspectiva, a dalt a la dreta, desenfocada ---------- */
#fons{opacity:.7;filter:blur(1.6px) saturate(1.1);
  -webkit-mask-image:radial-gradient(1400px 950px at 106% -8%,#000 22%,rgba(0,0,0,.45) 44%,transparent 72%);
          mask-image:radial-gradient(1400px 950px at 106% -8%,#000 22%,rgba(0,0,0,.45) 44%,transparent 72%)}
#fons .pcb{position:absolute;left:780px;top:-270px;width:1600px;height:1100px;transform-style:preserve-3d;transform:rotateX(58deg) rotateZ(-26deg)}
#fons .pcb svg{position:absolute;left:0;top:0;width:1600px;height:1100px}
#fons .ch{position:absolute;border-radius:14px;transform:translateZ(var(--z,20px));
  background:radial-gradient(circle at 16% 18%,rgba(255,255,255,.85) 0 6px,transparent 7px),linear-gradient(135deg,#9DAACB,#7280A5 55%,#5F6D93);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 12px 0 var(--e,#4F5B7B),0 36px 30px -12px rgba(21,23,28,.5)}
/* v4 · Llum: el LED de encendido de algunos chips (bokeh verde, sin filtros) */

  linear-gradient(135deg,#9DAACB,#7280A5 55%,#5F6D93)}
#fons .ch::before,#fons .ch::after{content:"";position:absolute}
#fons .ch::before{inset:-14px 16px;
  background:repeating-linear-gradient(90deg,#DDE1EA 0 9px,transparent 9px 21px) top/100% 14px no-repeat,repeating-linear-gradient(90deg,#DDE1EA 0 9px,transparent 9px 21px) bottom/100% 14px no-repeat}
#fons .ch::after{inset:16px -14px;

/* Rodeta: manec físic; .ptr és el que gira (data-a = angle de repòs) */
function dial(angle=0,tone='blue',enc=-1){
  let ticks='';
  for(let a=-135;a<=135;a+=45)ticks+=`<i class="tk" style="--a:${a}deg"></i>`;
  const h=`<span class="dial ${tone}" aria-hidden="true">${ticks}<span class="kn"><i class="ptr" data-a="${angle}" style="transform:rotate(${angle}deg)"><b></b></i><u></u></span></span>`;
  return enc<0?h:`<span class="dw" data-encen data-llum="${tone}" style="--d:${enc}ms">${h}</span>`;
}

/* Tub: ombra apilada (sense filtres: una línia recta té un requadre pla), vora fosca, cos i brillantor */
const STEEL={rim:'#565D6E',body:'#A9B0BF',hl:'rgba(255,255,255,.78)'};
const CORALT={rim:'#8A2713',body:'#D2462A',hl:'rgba(255,255,255,.5)'};

const NEONC={rim:'#B9341B',body:'#F26A4B',hl:'rgba(255,245,240,.97)',glow:'rgba(226,84,52,.70)',neon:true};
function tube(d,w,p){
  const sh=[[w+14,.07],[w+8,.08],[w+3,.13]].map(([sw,a])=>`<path class="sh" d="${d}" style="stroke:rgba(21,23,28,${a});stroke-width:${sw}px;translate:${(w*.3).toFixed(1)}px ${(w*.85).toFixed(1)}px"/>`).join('');

/* Xip en relleu: encapsulat amb cantell, potes metàl·liques, «die» elevat i una matriu de cel·les que s'encenen per onades */
function gpuChip(){
  const W=1776,H=448,cols=64,rows=13,x0=88,y0=78,gw=1600,gh=264,gap=6,bands=16,per=cols/bands;
  const cw=(gw-(cols-1)*gap)/cols,ch=(gh-(rows-1)*gap)/rows;
  let pins='';
  for(let i=0;i<34;i++){const x=(72+i*((W-144)/33)-8).toFixed(1);pins+=`<rect x="${x}" y="2" width="16" height="32" rx="4" style="fill:url(#gPinV)"/><rect x="${x}" y="${H-34}" width="16" height="32" rx="4" style="fill:url(#gPinV)"/>`;}
  for(let i=0;i<8;i++){const y=(64+i*((H-128)/7)-8).toFixed(1);pins+=`<rect x="2" y="${y}" width="32" height="16" rx="4" style="fill:url(#gPinH)"/><rect x="${W-34}" y="${y}" width="32" height="16" rx="4" style="fill:url(#gPinH)"/>`;}
  let dim='',lit='';
  for(let b=0;b<bands;b++){let g='';
    for(let k=0;k<per;k++){const c=b*per+k;
      for(let r=0;r<rows;r++){
        const x=(x0+c*(cw+gap)).toFixed(1),y=(y0+r*(ch+gap)).toFixed(1);
        if(b===0)dim+=`<rect x="${x}" y="${y}" width="${cw.toFixed(1)}" height="${ch.toFixed(1)}" rx="3"/>`;
        const v=((c*37+r*91+c*r*7)%11)/10;
        if(v>0.12)g+=`<rect x="${x}" y="${y}" width="${cw.toFixed(1)}" height="${ch.toFixed(1)}" rx="4" fill-opacity="${(0.42+0.58*v).toFixed(2)}"/>`;
      }}
    lit+=`<g class="band">${g}</g>`;}
  // la resta de bandes també necessiten les cel·les apagades
  for(let c=per;c<cols;c++)for(let r=0;r<rows;r++){dim+=`<rect x="${(x0+c*(cw+gap)).toFixed(1)}" y="${(y0+r*(ch+gap)).toFixed(1)}" width="${cw.toFixed(1)}" height="${ch.toFixed(1)}" rx="4"/>`;}
  return `<svg class="chip3" viewBox="0 0 ${W} ${H}" aria-hidden="true"><g class="pins" style="stroke:#7C8496;stroke-width:1.5">${pins}</g>`
   +`<rect x="24" y="38" width="${W-48}" height="386" rx="40" style="fill:#B9B29F"/>`
   +`<rect x="24" y="24" width="${W-48}" height="386" rx="40" style="fill:url(#gPkg);stroke:rgba(21,23,28,.28);stroke-width:3"/>`
   +`<rect x="34" y="34" width="${W-68}" height="366" rx="32" style="fill:none;stroke:rgba(255,255,255,.95);stroke-width:2"/>`
   +`<circle cx="52" cy="52" r="8" style="fill:rgba(21,23,28,.4)"/>`
   +`<rect class="dieglow" x="64" y="60" width="${W-128}" height="306" rx="24" style="fill:#3B63E0;fill-opacity:.62"/>`
   +`<g class="die-sh"><rect x="64" y="72" width="${W-128}" height="306" rx="24" style="fill:#6F8AE0"/><rect x="64" y="60" width="${W-128}" height="306" rx="24" style="fill:url(#gDie);stroke:rgba(47,85,212,.5);stroke-width:3"/></g>`
   +`<g class="dim">${dim}</g><g class="leds">${lit}</g>`
   +`<g clip-path="url(#clipDie)"><rect class="sweep" x="100" y="40" width="300" height="350" transform="skewX(-14)" style="fill:url(#gSweep);opacity:0"/></g></svg>`;
}

/* Pas 4: una pista amb gruix (projecció obliqua), tatxes en relleu i la data de tall com una barrera ratllada */
function step4(T){
  const TF=506,DX=26,DY=30,TH=18,TL=1696,TIP=1764,cx=[240,928,1576],cut=1332,BW=30,BH=326,BDX=22,BDY=26,Bx=cut-BW/2,By=TF-BH;
  const stroke='stroke="rgba(21,23,28,.20)" stroke-width="2" stroke-linejoin="round"';
  const track=`<g class="track" style="filter:drop-shadow(0 16px 10px rgba(21,23,28,.28))">`
   +`<path d="M0 ${TF} H${TL} V${TF+TH} H0 Z" fill="url(#gFront)" ${stroke}/>`
   +`<path d="M${TL} ${TF} L${TIP} ${TF-DY/2} V${TF-DY/2+TH} L${TL} ${TF+TH} Z" fill="#B3AC9A" ${stroke}/>`
   +`<path d="M0 ${TF} H${TL} L${TL+DX} ${TF-DY} H${DX} Z" fill="url(#gTop)" ${stroke}/>`
   +`<path d="M${TL} ${TF} L${TL+DX} ${TF-DY} L${TIP} ${TF-DY/2} Z" fill="url(#gTop)" ${stroke}/>`
   +`<path d="M${DX/2+14} ${TF-DY/2} H${TL-10}" fill="none" stroke="rgba(21,23,28,.22)" stroke-width="3" stroke-dasharray="20 16" stroke-linecap="round"/>`
   +`<path d="M4 ${TF+3} H${TL-4}" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2" stroke-linecap="round"/></g>`;
  const stems=cx.map(x=>tube(`M${x} 436 V${TF-DY/2-6}`,7,STEEL)).join('');
  const studs=cx.map(x=>{const sy=TF-DY/2;return `<g class="stud"><path d="M${x-18} ${sy} V${sy+10} A18 8.5 0 0 0 ${x+18} ${sy+10} V${sy}" style="fill:#8FA6EA;stroke:#3F5FC9;stroke-width:2.5"/><ellipse cx="${x}" cy="${sy}" rx="18" ry="8.5" style="fill:url(#gDie);stroke:#2F55D4;stroke-width:3"/><ellipse cx="${x-2}" cy="${sy-1}" rx="8" ry="3.4" style="fill:#fff"/></g>`;}).join('');
  const bar=`<g class="barrier" style="filter:drop-shadow(10px 8px 6px rgba(21,23,28,.32)) drop-shadow(0 0 11px rgba(210,70,42,.55))">`
   +`<polygon points="${Bx+BW},${TF} ${Bx+BW+BDX},${TF-BDY} ${Bx+BW+BDX},${By-BDY} ${Bx+BW},${By}" style="fill:#9C3118;stroke:#6E200F;stroke-width:2;stroke-linejoin:round"/>`
   +`<polygon points="${Bx},${By} ${Bx+BW},${By} ${Bx+BW+BDX},${By-BDY} ${Bx+BDX},${By-BDY}" style="fill:#F6C9BC;stroke:#9C3118;stroke-width:2;stroke-linejoin:round"/>`
   +`<rect x="${Bx}" y="${By}" width="${BW}" height="${BH}" style="fill:url(#haz);stroke:#9C3118;stroke-width:3"/></g>`;
  // luz de aviso: mancha coral sobre la pista, a los pies de la barrera, y una baliza LED en lo alto (degradados radiales: sin filtros)
  const bx=Bx+(BW+BDX)/2,by=By-BDY/2;
  const lamp=`<g class="lamp"><ellipse cx="${bx}" cy="${TF-DY/2+6}" rx="150" ry="30" style="fill:url(#gLamp);opacity:.75"/>`
   +`<circle cx="${bx}" cy="${by}" r="52" style="fill:url(#gLamp)"/><ellipse cx="${bx}" cy="${by}" rx="13" ry="9" style="fill:url(#gLedC);stroke:#8A2713;stroke-width:2"/></g>`;
  show(`<div class="a4">
    <svg class="tl" viewBox="0 0 1776 612" aria-hidden="true">${track}${stems}${studs}<g data-encen data-llum="coral" style="--d:1460ms">${bar}${lamp}</g></svg>
    <div class="cutwrap"><div class="cutpill">${esc(T.cutoff)}</div></div>
    <div class="card tint-blue ph p1"><strong class="t">${esc(T.pretraining)}</strong><span class="d">${esc(T.pretrainingDetail)}</span></div>
    <div class="card tint-blue ph p2"><strong class="t">${esc(T.adjustment)}</strong><span class="d">${esc(T.adjustmentDetail)}</span></div>
    <div class="card edge-blue ph p3" data-encen data-llum="blue" style="--d:1560ms"><strong class="t">${esc(T.use)}</strong><span class="d">${esc(T.useDetail)}</span></div></div>`,T.captions[3],T.notes[3]);
  motion($('.a4 .track'),[{opacity:0,scale:'0 1'},{opacity:1,scale:'1 1'}],{duration:760,fill:'backwards'});
  enter('.a4 .ph',{gap:140,dx:-24,dy:0,dur:560});
  document.querySelectorAll('.a4 .stud,.a4 .tb').forEach((el,i)=>motion(el,[{opacity:0},{opacity:1}],{duration:400,delay:380+(i%3)*140,fill:'backwards'}));
  motion($('.a4 .barrier'),[{opacity:0,transform:'translateY(-90px)'},{opacity:1,transform:'translateY(0)'}],{delay:900,duration:620,fill:'backwards'});
  motion($('.a4 .lamp'),[{opacity:0},{opacity:0,offset:.7},{opacity:1}],{delay:900,duration:620,fill:'backwards'});
  enter('.a4 .cutpill',{delay:1000,dur:520,dy:-14});
}

      <circle class="dot" cx="392" cy="${Y}" r="46" style="fill:url(#gLamp)"/><circle class="dot" cx="392" cy="${Y}" r="14" style="fill:url(#gLedC);stroke:#8A2713;stroke-width:2"/></svg>

    // Arrenca amb els dos interruptors apagats i el conducte tancat per la vàlvula; s'encenen d'un en un, la vàlvula s'aixeca i el flux omple el conducte.
    sws.forEach((sw,i)=>{
      const d=520+i*280,kn=sw.querySelector('.kn'),ck=sw.querySelector('.ck'),gl=sw.querySelector('.gl');
      sw.animate([{backgroundColor:'rgba(95,90,80,.38)'},{backgroundColor:'rgba(95,90,80,.38)',offset:.01},{backgroundColor:'#D2462A'}],{duration:420,delay:d,easing:EASE,fill:'backwards'});

function renderStep(step,prev=step){

/* Fons temàtic (el crida IA-S1-comu.js): una placa de circuit en perspectiva, a dalt a la dreta. Pistes en relleu, xips amb potes
   i condensadors elevats (translateZ). Sense text; desenfocada i amb màscara perquè no competeixi amb el contingut. */
window.fonsIA=function(capa){
  const rt=(x1,y1,x2,y2,xa)=>{const dy=y2-y1,dir=Math.sign(x2-x1)||1,xb=xa+dir*Math.abs(dy);return `M${x1} ${y1} H${xa} L${xb} ${y2} H${x2}`;};
  const rv=(x1,y1,x2,y2,ya)=>{const dx=x2-x1,dir=Math.sign(y2-y1)||1,yb=ya+dir*Math.abs(dx);return `M${x1} ${y1} V${ya} L${x2} ${yb} V${y2}`;};
  const lines=[];
  const bus=(f,n,sp,args)=>{for(let k=0;k<n;k++)lines.push(f(...args(k*sp)));};
  bus(rt,6,18,o=>[460,200+o,800,420+o,540+o*.6]);          // xip A -> CPU
  bus(rt,6,18,o=>[1250,210+o,1140,440+o,1200-o*.6]);        // xip B -> CPU
  bus(rt,5,18,o=>[660,800+o,800,620+o,700+o*.5]);           // xip C -> CPU
  bus(rt,5,18,o=>[1230,790+o,1140,610+o,1190-o*.5]);        // xip D -> CPU
  bus(rt,5,18,o=>[760,110+o,1250,230+o,880+o]);             // xip F -> B
  bus(rv,5,18,o=>[150+o,470,300+o,330,420]);                // xip E -> A
  bus(rt,4,18,o=>[420,620+o,260,760+o,380]);                // C -> E
  let tr='',via='';
  lines.forEach(d=>{tr+=`<path d="${d}" style="fill:none;stroke:#86BCA3;stroke-width:10;stroke-linecap:round;stroke-linejoin:round"/><path d="${d}" style="fill:none;stroke:#F6FBF8;stroke-width:5;stroke-linecap:round;stroke-linejoin:round"/>`;});
  [[460,200],[800,420],[1250,210],[1140,440],[660,800],[800,620],[1230,790],[1140,610],[760,110],[150,470],[300,330]].forEach(([x,y],k)=>{
    if(k%2===0)via+=`<circle cx="${x}" cy="${y}" r="46" style="fill:url(#pcbGlow)"/>`;
    via+=`<circle cx="${x}" cy="${y}" r="9" style="fill:${k%2===0?'#FFF3C4':'#E4BC59'};stroke:#A97A18;stroke-width:3"/>`;});
  // v4 · Llum: tres pistas con corriente (trazo claro con halo, sin filtros)
  let lit='';
  [2,9,23].forEach(i=>{const d=lines[i];if(d)lit+=`<path d="${d}" style="fill:none;stroke:rgba(90,235,170,.55);stroke-width:20;stroke-linecap:round;stroke-linejoin:round"/><path d="${d}" style="fill:none;stroke:#E9FFF5;stroke-width:5;stroke-linecap:round;stroke-linejoin:round"/>`;});
  const board=`<svg viewBox="0 0 1600 1100" aria-hidden="true"><defs><linearGradient id="pcbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D2EDE0"/><stop offset="1" stop-color="#A9D6C1"/></linearGradient><radialGradient id="pcbGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE9A0" stop-opacity=".95"/><stop offset=".45" stop-color="#F4C74A" stop-opacity=".42"/><stop offset="1" stop-color="#F4C74A" stop-opacity="0"/></radialGradient></defs>`
    +`<rect x="0" y="18" width="1600" height="1082" rx="40" style="fill:#8DBBA4"/><rect x="0" y="0" width="1600" height="1082" rx="40" style="fill:url(#pcbg);stroke:#86BCA3;stroke-width:6"/>`
    +`<rect x="26" y="26" width="1548" height="1030" rx="26" style="fill:none;stroke:rgba(255,255,255,.7);stroke-width:3"/>`
    +[[60,60],[1540,60],[60,1022],[1540,1022]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="16" style="fill:#EEF7F2;stroke:#86BCA3;stroke-width:5"/>`).join('')
    +tr+lit+via+`</svg>`;
  const chips=[[800,380,340,340,44],[260,170,200,160,26],[1250,160,170,230,30],[420,760,240,180,26],[1230,740,210,170,28],[120,470,100,100,20],[640,90,120,90,20],[1100,930,120,100,20]];
  const caps=[[560,560,46,26],[1180,560,46,26],[640,420,36,22],[980,860,46,26],[330,560,36,22],[1440,520,46,26],[900,200,46,26],[700,980,36,22]];
  capa.innerHTML=`<div class="pcb">${board}`
    +chips.map(([l,t,w,h,z],k)=>`<i class="ch${k<3?' on':''}" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px;--z:${z}px"></i>`).join('')
    +caps.map(([l,t,w,h])=>`<i class="cap" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px"></i>`).join('')+`</div>`;
};
boot(7,renderStep);
