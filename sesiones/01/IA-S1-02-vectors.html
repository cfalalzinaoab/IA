<!doctype html>
<!--
A2 — Dels tokens als vectors (v2, 13-10-2026).
Les dotze components del vector i totes les posicions del mapa són valors il·lustratius, no dades extretes de cap model.
S'indica «Valors il·lustratius» en tots els passos.
Simplificació docent: un vector es projecta en dues dimensions; el desplaçament de «banc» representa el canvi de
representació contextual, no una modificació de la taula estàtica de vectors del token.
v3 (13-10-2026): profunditat. Tecles (fitxa, cel·les, pestanyes), safata enfonsada, lloses amb cantell, esferes amb ombra de contacte,
eixos com a barres, arc del salt amb ombra a terra, placa en relleu i fons de constel·lació d'esferes (window.fonsIA).
Cinc passos: 1 gat → números · 2 el punt al mapa · 3 quatre grups · 4 banc (dos significats) · 5 mapa complet i avís de les dimensions.
v4 (13-10-2026): llum. «gat» i les caselles retroil·luminades en blau amb encesa en aterrar i ona de reflexos (pas 1); esfera «gat» emissora amb halo i LED, guies i fletxa com a neó blau (pas 2); halos suaus del color de grup a les esferes i lloses amb llum de color a sota (passos 3 i 5); arc coral de neó amb degradat de cometa, halo de context a la bola «banc», anell de llum en arribar, pestanya activa amb halo (pas 4); avís de dimensions amb llum corall, reflex i icones que s'encenen (pas 5); esferes del fons com a bokeh lluminós.
Ritme (13-10-2026): carrega IA-S1-ritme.js al <head>; tot el moviment va més a poc a poc, pel mateix factor (LENT, a IA-S1-ritme.js).
-->
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dels tokens als vectors</title><style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
#viewport{position:fixed;inset:0;overflow:hidden}
#stage{width:1920px;height:1080px;position:absolute;transform-origin:top left;overflow:hidden}
button,a{font:inherit}
button{cursor:pointer;color:var(--ink)}

/* ---------- Mapa (SVG de l'escena: 1776 × 612, escala 1:1) ---------- */
.map-svg{position:absolute;left:0;top:0;width:1776px;height:612px;overflow:visible;pointer-events:none}
.axes .rod{stroke:#6F695E;stroke-width:9px;fill:none;stroke-linecap:round;stroke-linejoin:round}
.axes .rod-hi{stroke:rgba(255,255,255,.55);stroke-width:3px;fill:none;stroke-linecap:round;stroke-linejoin:round}
.axes .rod-sh{fill:none;stroke:#15171C;stroke-linecap:round;stroke-linejoin:round}
.axes .tip{fill:#6F695E}
.axis{stroke-dasharray:1 2}
.slab{transform-box:fill-box;transform-origin:center}
.ball,.csh{transform-box:fill-box;transform-origin:center}
svg .kicker{fill:var(--muted)}
svg .w{font-size:40px;font-weight:500;fill:var(--ink)}
svg .w.hero{font-weight:700}
.guide{stroke:var(--blue);stroke-opacity:.55;stroke-width:4px;stroke-linecap:round;stroke-dasharray:1 2;fill:none}
.ring{fill:none;stroke:var(--blue);stroke-width:4px;transform-box:fill-box;transform-origin:center;opacity:0}
.hop{fill:none;stroke:#3A3D45;stroke-width:6px;stroke-linecap:round;stroke-linejoin:round}
.hop.line{stroke-dasharray:1 2}
.hop.hi{stroke:rgba(255,255,255,.5);stroke-width:2px}
.hop.gs{stroke:#15171C;stroke-linecap:round}
.ghost circle{fill:none;stroke:var(--muted);stroke-width:3px;stroke-dasharray:6 6}

/* ---------- Pas 1: gat → fila de números ---------- */
.s1{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.s1 .kicker{margin-bottom:8px}
.tok{width:300px;height:128px;padding:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:68px;font-weight:700;letter-spacing:-.01em}
.down{display:block;margin:12px 0}
.tray{display:flex;align-items:center;gap:8px;padding:24px;width:1776px}
.cell{flex:1 1 0;min-width:0;height:136px;display:flex;align-items:center;justify-content:center;
  background:var(--surface);border:2px solid color-mix(in srgb,var(--blue) 30%,transparent);border-radius:var(--radius-sm);
  font-size:44px;font-weight:600;letter-spacing:-.01em}
.ell{flex:0 0 56px;display:block}
.ell circle{fill:var(--muted)}
.gpt{margin-top:24px;font-size:36px;color:var(--muted)}
.gpt b{color:var(--ink);font-weight:700}

/* ---------- Pas 2: la fila a dalt i el punt al mapa ---------- */
.row2{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;align-items:stretch;gap:24px}
.chip2{width:176px;padding:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:56px;font-weight:700}
.tray.sm{width:auto;gap:6px;padding:10px}
.tray.sm .cell{flex:0 0 104px;height:76px;font-size:36px;border-radius:12px}

/* ---------- Pas 4: dues frases com a pestanyes ---------- */
.tab{position:absolute;top:0;width:768px;height:96px;margin:0;padding:0 24px;display:flex;align-items:center;justify-content:center;
  font-size:40px;font-weight:450;border:4px solid var(--line);text-align:center}
.tab b{font-weight:800;text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:8px;text-decoration-color:var(--tabc)}

/* ---------- Pas 5: avís de les dimensions ---------- */
.banner{position:absolute;left:0;top:0;width:1776px;height:104px;padding:0 48px;display:flex;align-items:center;justify-content:space-evenly}
.banner .half{display:flex;align-items:center;gap:20px}
.banner .half svg{flex:0 0 56px;width:56px;height:56px;display:block}
.banner .half svg *{stroke:var(--coral);stroke-width:4px;fill:none;stroke-linecap:round;stroke-linejoin:round}
.banner .half svg circle{fill:var(--coral);stroke:none}
.banner .val{display:block;margin-top:2px;font-size:46px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
.banner .kicker{display:block;line-height:1.1;color:color-mix(in srgb,var(--coral) 60%,var(--ink))}
.banner .sep{width:6px;height:60px;border-radius:3px;background:rgba(210,70,42,.16);box-shadow:inset 0 2px 3px rgba(21,23,28,.22),1px 1px 0 rgba(255,255,255,.85)}

/* ---------- v3 · Profunditat ----------
   Una sola llum, de dalt a l'esquerra. Fitxes i pestanyes són tecles (--key); les safates, enfonsades;
   les taques dels grups són lloses amb cantell; els punts del mapa, esferes amb ombra de contacte.
   El text de l'escena sempre queda de cara. */
#scene .tok,#scene .chip2{background:var(--surface-grad);border:3px solid var(--blue);--edge:#6B87E8;transform-origin:50% 100%;
  box-shadow:0 22px 30px -6px rgba(47,85,212,.46),inset 0 2px 0 rgba(255,255,255,.8),inset 0 -2px 0 rgba(21,23,28,.05),0 9px 0 var(--edge),0 11px 0 rgba(21,23,28,.10),0 24px 26px -12px rgba(21,23,28,.30)}
#scene .tray{background:linear-gradient(180deg,#D5DFFB 0%,#E8EDFF 100%);border:2px solid color-mix(in srgb,var(--blue) 26%,transparent);
  box-shadow:inset 0 7px 16px rgba(21,23,28,.17),inset 0 -2px 0 rgba(255,255,255,.75),0 2px 0 rgba(255,255,255,.85);padding:24px 24px 44px}
#scene .tray.sm{padding:12px 12px 28px}
#scene .cell{background:var(--surface-grad);--edge:#7F9AEA;border:2px solid rgba(21,23,28,.07);transform-origin:50% 100%;
  box-shadow:0 16px 24px -6px rgba(47,85,212,.42),inset 0 2px 0 rgba(255,255,255,.8),inset 0 -2px 0 rgba(21,23,28,.05),0 9px 0 var(--edge),0 11px 0 rgba(21,23,28,.10),0 24px 26px -12px rgba(21,23,28,.30)}
#scene .ell{margin-bottom:4px}

#scene .tab{background:var(--surface-grad);border:3px solid rgba(21,23,28,.10);--edge:#D3CDBF;cursor:pointer;transform-origin:50% 100%;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.8),inset 0 -2px 0 rgba(21,23,28,.05),0 9px 0 var(--edge),0 11px 0 rgba(21,23,28,.10),0 24px 26px -12px rgba(21,23,28,.42);
  transition:background .4s var(--ease),border-color .4s var(--ease),font-weight .4s var(--ease),box-shadow .4s var(--ease),translate .4s var(--ease)}
#scene .tab[data-active="true"]{background:var(--tabs);border-color:var(--tabc);--edge:color-mix(in srgb,var(--tabc) 45%,#fff);translate:0 8px;
  box-shadow:inset 0 5px 10px rgba(21,23,28,.16),inset 0 -2px 0 rgba(21,23,28,.05),0 1px 0 var(--edge),0 2px 0 rgba(21,23,28,.10),0 6px 10px -8px rgba(21,23,28,.35),0 0 20px 2px rgba(var(--tcg,210,70,42),.38),0 0 54px 8px rgba(var(--tcg,210,70,42),.18);font-weight:650}
#scene .tab:hover:not([data-active="true"]){translate:0 -2px}
#scene .tab:active{translate:0 7px}
#scene .tab:focus-visible{outline:4px solid var(--accent);outline-offset:8px}

#scene .banner{background:linear-gradient(180deg,#FFF0E9 0%,#FFDDD0 100%);border:3px solid color-mix(in srgb,var(--coral) 36%,transparent);transform-origin:50% 100%;
  box-shadow:0 22px 34px -8px rgba(210,70,42,.40),inset 0 3px 0 rgba(255,255,255,.9),inset 0 -3px 0 rgba(210,70,42,.10),0 9px 0 #E3917A,0 11px 0 rgba(21,23,28,.10),0 26px 30px -14px rgba(21,23,28,.30)}
.banner .rv{position:absolute;width:18px;height:18px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#fff 0 8%,#E6DFD2 30%,#8C8576 100%);box-shadow:0 2px 3px rgba(21,23,28,.35),inset 0 0 0 1px rgba(21,23,28,.12)}
.banner .rv.a{left:14px;top:14px}.banner .rv.b{right:14px;top:14px}.banner .rv.c{left:14px;bottom:14px}.banner .rv.d{right:14px;bottom:14px}
.banner .ic{flex:none;width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 28%,#FFF7F3,#FFD3C2);box-shadow:inset 0 4px 8px rgba(21,23,28,.20),inset 0 -2px 0 rgba(255,255,255,.85),0 2px 0 rgba(255,255,255,.85),0 0 16px 3px rgba(210,70,42,.28)}

/* Fons: una constel·lació d'esferes amb profunditat (mida, desenfocament i paral·laxi diferents) */
#fons{opacity:.92;filter:saturate(1.06);
  -webkit-mask-image:radial-gradient(1400px 940px at 100% 0%,#000 26%,rgba(0,0,0,.5) 50%,transparent 76%),linear-gradient(90deg,#000 0,rgba(0,0,0,.55) 3%,transparent 11%),linear-gradient(270deg,#000 0,rgba(0,0,0,.55) 3%,transparent 11%);
          mask-image:radial-gradient(1400px 940px at 100% 0%,#000 26%,rgba(0,0,0,.5) 50%,transparent 76%),linear-gradient(90deg,#000 0,rgba(0,0,0,.55) 3%,transparent 11%),linear-gradient(270deg,#000 0,rgba(0,0,0,.55) 3%,transparent 11%)}
#fons .cl{position:absolute;inset:0;transform:translate3d(calc(var(--p,0) * var(--k) * 1px),calc(var(--p,0) * var(--k) * -.35px),0);transition:transform 1.2s var(--ease)}
#fons .cl svg{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
#fons .cl line{stroke:var(--c);stroke-opacity:.32;stroke-width:2px;stroke-linecap:round}
#fons .sf{position:absolute;border-radius:50%;left:var(--x);top:var(--y);width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
  --c1:color-mix(in srgb,var(--c) 38%,#fff);--c2:color-mix(in srgb,var(--c) 56%,#000);
  background:radial-gradient(circle at 33% 28%,#fff 0,var(--c1) 12%,var(--c) 46%,var(--c2) 100%);
  box-shadow:inset -3px -5px 10px -4px rgba(0,0,0,.28),0 0 calc(var(--s) * .55) calc(var(--s) * .07) color-mix(in srgb,var(--c) 52%,transparent);
  filter:blur(var(--b));opacity:var(--o)}

/* ---------- v4 · Llum ----------
   Azul = «gat» y los datos; coral = lo elegido (destino de «banc», aviso). Neón en SVG con capas de trazo (sin filtros en lo largo);
   solo los grupos pequeños y estáticos llevan drop-shadow. Las encesas solo corren al avanzar (body[data-dir="back"] las quita). */
#scene .s1 .down{filter:drop-shadow(0 0 6px rgba(47,85,212,.6))}
#scene .s1 .down .stroke{stroke:var(--blue);stroke-opacity:.95;stroke-width:5px}
.nb{filter:drop-shadow(0 0 6px rgba(47,85,212,.62))}
.nb .hop{stroke:var(--blue)}
.fl{transform-box:fill-box;transform-origin:center;opacity:0}
#hophead{stroke:#E8573A;filter:drop-shadow(0 0 6px rgba(210,70,42,.7))}
</style><link rel="icon" href="data:,"><link rel="stylesheet" href="IA-S1-estil.css"><script src="IA-S1-ritme.js"></script></head><body data-animation="vectors"><div id="viewport"><div id="stage"><div id="course"></div><div id="stamp"></div><h1 id="title"></h1><main id="scene"></main><div id="caption"></div><div id="note"></div><footer><a id="index" href="IA-S1-00-index.html"></a><span id="help"></span><button id="prev">←</button><button id="next">→</button><button id="full">F</button><span id="counter" aria-live="polite"></span></footer></div></div><script>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current=0, totalSteps=1, drawStep, generation=0;
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const EASE='cubic-bezier(.2,.8,.2,1)';
/* Una animació curta; amb «reduir moviment» no se'n fa cap i es pinta l'estat final. */
function A(el,frames,o={}){if(!el||reduced())return null;return el.animate(frames,{duration:520,easing:EASE,fill:'both',...o});}
function show(html,caption,note,stamp,anim){
  $('#scene').innerHTML=html;$('#caption').textContent=caption;$('#note').textContent=note;$('#stamp').textContent=stamp;
  if(anim&&caption)A($('#caption'),[{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'translateY(0)'}],{duration:520});
}
function resize(){const s=Math.min(innerWidth/1920,innerHeight/1080);const stage=$('#stage');stage.style.transform=`scale(${s})`;stage.style.left=`${(innerWidth-1920*s)/2}px`;stage.style.top=`${(innerHeight-1080*s)/2}px`;}
function go(n){const next=Math.max(0,Math.min(totalSteps-1,n));if(next===current&&generation)return;const prev=current;current=next;generation++;document.getAnimations().forEach(a=>a.cancel());drawStep(current,prev);$('#counter').textContent=`${current+1}/${totalSteps}`;$('#prev').disabled=current===0;$('#next').disabled=current===totalSteps-1;document.body.dataset.step=String(current+1);}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){$('#note').textContent=TEXTOS.fullscreenError;}}
function boot(total,renderer){totalSteps=total;drawStep=renderer;document.title=TEXTOS.title;$('#title').textContent=TEXTOS.title;$('#course').textContent=TEXTOS.course;$('#help').textContent=TEXTOS.help;$('#index').textContent=TEXTOS.index;$('#prev').ariaLabel=TEXTOS.previous;$('#next').ariaLabel=TEXTOS.next;$('#full').ariaLabel=TEXTOS.full;$('#prev').textContent=TEXTOS.prevSymbol;$('#next').textContent=TEXTOS.nextSymbol;$('#full').textContent=TEXTOS.fullSymbol;
 $('#prev').onclick=e=>{e.stopPropagation();go(current-1)};$('#next').onclick=e=>{e.stopPropagation();go(current+1)};$('#full').onclick=e=>{e.stopPropagation();fullscreen()};
 $('#stage').onclick=e=>{if(e.target.closest('button,a,input,select,[data-interactive]'))return;go(current+1)};
 addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.target.closest('input,textarea,select'))return;let handled=true;if(['ArrowRight',' ','PageDown'].includes(e.key))go(current+1);else if(['ArrowLeft','PageUp'].includes(e.key))go(current-1);else if(e.key==='Home'){generation=0;go(0)}else if(e.key.toLowerCase()==='f')fullscreen();else handled=false;if(handled)e.preventDefault()});
 addEventListener('resize',resize);resize();go(0);
 A($('#title'),[{opacity:.85,transform:'translateY(8px)'},{opacity:1,transform:'translateY(0)'}],{duration:600});
 window.presentation={go,next:()=>go(current+1),previous:()=>go(current-1),get step(){return current+1},get total(){return totalSteps},get generation(){return generation}};
}

/* ======================= Peces gràfiques ======================= */
const $$ = s => [...document.querySelectorAll(s)];
const draw=(el,delay=0,dur=500)=>A(el,[{strokeDashoffset:1},{strokeDashoffset:0}],{delay,duration:dur});
const fade=(el,delay=0,dur=420)=>A(el,[{opacity:0},{opacity:1}],{delay,duration:dur});
/* Una tecla que cau sobre la taula: gira des de dalt (com a A1). */
const fall=(el,delay=0,dur=620)=>A(el,[{opacity:0,transform:'perspective(700px) rotateX(-78deg) translateY(-14px)'},{opacity:1,transform:'none'}],{delay,duration:dur});
/* v4 · Llum: encesa de llegada (CSS, solo al avanzar) */
const enc=(el,color,d)=>{if(!el)return;el.setAttribute('data-encen','');el.setAttribute('data-llum',color);el.style.setProperty('--d',d+'ms');};

/* ---------- Defs: esferes (degradat radial, llum a dalt a l'esquerra), lloses i ombres ---------- */
const NOMS=['blue','violet','green','amber','coral','ink'];
const EDGE={blue:'#9FB4F1',violet:'#B7A4EE',green:'#8DCBAD',amber:'#DDB963',coral:'#E8A88E'};
function defs(){
  let h='<defs>';
  NOMS.forEach(n=>{
    h+=`<radialGradient id="hl-${n}"><stop offset="0" style="stop-color:color-mix(in srgb,var(--${n}) 38%,#fff);stop-opacity:.95"/><stop offset=".3" style="stop-color:var(--${n});stop-opacity:.52"/><stop offset=".65" style="stop-color:var(--${n});stop-opacity:.15"/><stop offset="1" style="stop-color:var(--${n});stop-opacity:0"/></radialGradient><radialGradient id="hs-${n}"><stop offset="0" style="stop-color:var(--${n});stop-opacity:.95"/><stop offset=".4" style="stop-color:var(--${n});stop-opacity:.5"/><stop offset=".75" style="stop-color:var(--${n});stop-opacity:.12"/><stop offset="1" style="stop-color:var(--${n});stop-opacity:0"/></radialGradient><radialGradient id="se-${n}" cx=".5" cy=".5" r=".5" fx=".38" fy=".32"><stop offset="0" stop-color="#fff"/><stop offset=".3" style="stop-color:color-mix(in srgb,var(--${n}) 42%,#fff)"/><stop offset=".72" style="stop-color:var(--${n})"/><stop offset="1" style="stop-color:color-mix(in srgb,var(--${n}) 80%,#000)"/></radialGradient>`;
    h+=`<radialGradient id="sp-${n}" cx=".5" cy=".5" r=".5" fx=".34" fy=".28"><stop offset="0" style="stop-color:color-mix(in srgb,var(--${n}) 30%,#fff)"/><stop offset=".42" style="stop-color:var(--${n})"/><stop offset="1" style="stop-color:color-mix(in srgb,var(--${n}) 56%,#000)"/></radialGradient>`;
    if(n!=='ink'){
      h+=`<linearGradient id="pl-${n}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:color-mix(in srgb,var(--${n}-soft) 55%,#fff)"/><stop offset="1" style="stop-color:color-mix(in srgb,var(--${n}-soft) 82%,var(--${n}))"/></linearGradient>`;
      h+=`<linearGradient id="rim-${n}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".4" stop-color="#fff" stop-opacity=".3"/><stop offset="1" style="stop-color:var(--${n})" stop-opacity=".4"/></linearGradient>`;
    }
  });

/* Bola amb brillo y sombra de contacto (la sombra va a la derecha y abajo: la luz viene de arriba a la izquierda). */

/* Marcadors: ara són esferes. Taca suau: una el·lipse amb una deformació lleu, perquè no sembli un cercle de plantilla. */
function blobD(seed,rx=368,ry=100){
  const n=96,p=[];
  for(let i=0;i<n;i++){
    const t=i/n*Math.PI*2;
    const k=1+.03*Math.sin(2*t+seed*1.9)+.02*Math.sin(3*t+seed*2.7)+.012*Math.sin(5*t+seed);
    p.push((rx*k*Math.cos(t)).toFixed(1)+' '+(ry*k*Math.sin(t)).toFixed(1));
  }

}

const MOB4={cx:420,cy:372}, DIN4={cx:1356,cy:372};

function cubic(p0,c1,c2,p3,t){const u=1-t;return [u*u*u*p0[0]+3*u*u*t*c1[0]+3*u*t*t*c2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*c1[1]+3*u*t*t*c2[1]+t*t*t*p3[1]];}
/* La trajectòria de la bola és l'arc: 40 mostres; l'arc visible comença fora de la bola d'origen i acaba just damunt la de destí. */
const NS=40, PTS=Array.from({length:NS+1},(_,i)=>cubic([BANC[0].x,BANC[0].y],HOP.c1,HOP.c2,[BANC[1].x,BANC[1].y],i/NS));
const dd=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
let I0=0;while(dd(PTS[I0],PTS[0])<BR+10)I0++;
let I1=NS;while(dd(PTS[I1],PTS[NS])<BR+16)I1--;
const ARC=PTS.slice(I0,I1+1), CUM=[0];
for(let i=1;i<ARC.length;i++)CUM.push(CUM[i-1]+dd(ARC[i],ARC[i-1]));
const ARC_D='M'+ARC.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L');
const frac=i=>i<=I0?0:(i>=I1?1:CUM[i-I0]/CUM[CUM.length-1]);
const GY=i=>BANC[0].y+(BANC[1].y-BANC[0].y)*((PTS[i][0]-BANC[0].x)/(BANC[1].x-BANC[0].x));   // el terra sota la bola

const rv=(f,r)=>r?f.slice().reverse():f;

const arcFrames=r=>rv(PTS.map((p,i)=>({strokeDashoffset:(1-frac(i)).toFixed(4)})),r);
const gndFrames=r=>rv(PTS.map(p=>({strokeDashoffset:(1-(p[0]-BANC[0].x)/(BANC[1].x-BANC[0].x)).toFixed(4)})),r);
const T4=i=>`translate(${BANC[i].x}px,${BANC[i].y}px)`;
const TS=i=>`translate(${BANC[i].x+SH.x}px,${BANC[i].y+SH.y}px) scale(1)`;
const chev=(()=>{const e=ARC[ARC.length-1],q=ARC[ARC.length-3],L=Math.hypot(e[0]-q[0],e[1]-q[1]),ux=(e[0]-q[0])/L,uy=(e[1]-q[1])/L,w=(a)=>{const c=Math.cos(a),s=Math.sin(a);return [e[0]-24*(ux*c-uy*s),e[1]-24*(ux*s+uy*c)];};const a=w(.62),b=w(-.62);return `M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${e[0].toFixed(1)} ${e[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}`;})();

  if(!anim||reduced()){paint(1);return;}
  // entrada: les etiquetes i els dos veïnats; després, el banc fa el salt sol
  $$('.tab').forEach((b,i)=>A(b,[{opacity:0,transform:'translateY(-16px)'},{opacity:1,transform:'translateY(0)'}],{delay:i*80,duration:460}));
  $$('.grp').forEach((g,k)=>{
    A(g.querySelector('.slab'),[{opacity:0,transform:'translateY(-40px) scale(.95)'},{opacity:1,transform:'translateY(0) scale(1)'}],{delay:120+k*80,duration:560});
    fade(g.querySelector('.kicker'),300+k*80,360);
    g.querySelectorAll('.pt').forEach((p,j)=>dropBall(p,360+k*80+j*70,40,520));
  });
  fade($('#banc'),240,360);fade($('#bancSh'),240,360);
  const g=generation;
  setTimeout(()=>{if(g===generation)choose(1);},900);
}

function renderStep(step,prev){
  const anim=!reduced()&&step>=prev;   // al retrocedir (o amb «reduir moviment») es pinta l'estat final
  [step1,step2,step3,step4,step5][step](anim);
}
