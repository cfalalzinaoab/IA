<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>IA · Sessió 2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0c2330;color:#142e3d;font-family:Corbel,"Segoe UI",Arial,sans-serif}body{overflow:hidden}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #e3a84e;outline-offset:4px}#presentation{height:100%;display:grid;place-items:center}#stage{position:relative;width:min(100vw,177.7778vh);height:min(100vh,56.25vw);background:#f6f3e9;overflow:hidden;box-shadow:0 1rem 4rem #0005;font-size:min(2.15vw,3.82vh)}.slide{position:absolute;inset:0;padding:5.1% 7% 8%;display:flex;flex-direction:column}.slide:before{content:"";position:absolute;left:0;top:0;bottom:0;width:1%;background:#16817d}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.48em;font-weight:700;color:#237b79;margin-bottom:1.1em}.slide h1,.slide h2{font-family:Sitka,Georgia,serif;font-weight:600;line-height:1.08;letter-spacing:-.025em;margin:0;max-width:95%}.slide h1{font-size:2.05em}.slide h2{font-size:1.45em}.subtitle{font-size:.75em;line-height:1.3;margin:.7em 0 0;color:#52656a;max-width:85%}.body{margin-top:1.15em;min-height:0;flex:1}.title-slide{justify-content:center}.title-slide .body{flex:0}.title-slide h1{max-width:80%}.statement .body,.quote .body{display:flex;align-items:center}.items{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.5em}.item{display:flex;gap:.65em;line-height:1.22;font-size:.8em}.item .label{font-size:.65em;color:#16817d;font-weight:700;min-width:2em;padding-top:.16em}.item .detail{display:block;color:#53666b;font-size:.75em;margin-top:.2em}.item[data-reveal]{transition:opacity .35s ease,transform .35s ease}.item.pending{opacity:0;transform:translateY(.25em);visibility:hidden}.workflow .items,.steps .items{gap:0}.workflow .item,.steps .item{border-top:1px solid #a9c2bd;padding:.42em 0}.workflo <script>const DECK_DATA={"title":"Conversar i dirigir el treball","subtitle":"De l’encàrrec a una decisió comprovada","date":"2026-10-30","language":"ca","slides":[{"id":"s01","section":"A","title":"Conversar i dirigir el treball","kind":"title","items":[{"text":"De l’encàrrec a una decisió comprovada","reveal":1},{"text":"30 d’octubre · 11.30–13.00","reveal":2}],"notes":"Sessió 2 de 13. 76 minuts de recorregut i 14 de marge. Recorregut: resultat → context → aclariment → pla → producció → comprovació → tancament. No cal enviar set missatges; separar fases quan hi ha una decisió o un error per aturar.","sources":[]},{"id":"s02","section":"A","title":"Quina resposta semblava bona?","kind":"practice","items":[{"text":"Una millora útil","reveal":1},{"text":"Un error que vau corregir","reveal":2}],"notes":"Recollir dos exemples de casa i classificar: informació absent, invenció, pèrdua de condició o conversa que no s’acabava.","sources":[],"minutes":2},{"id":"s03","section":"A","title":"El cas fictici · una prova de vuit preguntes","kind":"evidence","items":[{"text":"8 preguntes · 20 minuts previstos","reveal":1},{"text":"24 inscrites · 18 assistents · 12 fitxes completes","reveal":2},{"text":"No es va cronometrar el temps real","reveal":3}],"notes":"El cas és fictici. Document A · registre de la prova \n     Paràgraf 1: «A la sessió del 12 d'octubre hi havia 24 persones inscrites. N'hi van assistir 18. Es van recollir 12 fitxes completes. El registre no indica per què les altres sis persones assistents no van entregar una fitxa completa.» \n     Paràgraf 2: «La fitxa tenia vuit preguntes i estava prevista per a 20 minuts. No es va cronometrar quant es va trigar a fer-la. Una de les preguntes demanava comparar dues fonts que donaven xifres diferents. No es van guardar exemples de les respostes.» \n     Document B · notes de preparació \n     Paràgraf 1: «Una docent explica que va trigar 25 minuts a corregir cinc fitxes. No consta com les va triar ni quina pauta va fer servir. Un altre docent creu que una pauta comuna podria reduir el temps de correcció. No s'ha provat.» \n     Paràgraf 2: «La propera prova hauria de permetre observar si les persones distingeixen dada i interpretació i si localitzen una discrepància entre dos textos. L'equip encara ha d'acordar la durada i la pauta de correcció.» A la pantalla es recorre el cas fictici; les parelles treballen amb una necessitat pròpia. Documents i diàleg al full de materials.","sources":[],"minutes":2},{"id":"s04","section":"A","title":"Les set fases del treball","subtitle":"Una tasca petita pot necessitar una sola petició","kind":"workflow","items":[{"label":"01","text":"Resultat","detail":"Què necessitem","reveal":1},{"label":"02","text":"Context","detail":"Amb quines fonts","reveal":2},{"label":"03","text":"Aclariment","detail":"Quina dada falta","reveal":3},{"label":"04","text":"Pla","detail":"Quin producte farem","reveal":4},{"label":"05","text":"Producció","detail":"Elaborar-lo","reveal":5},{"label":"06","text":"Comprovació","detail":"Contrastar amb criteris","reveal":6},{"label":"07","text":"Tancament","detail":"Decisió i pendents","reveal":7}],"notes":"El recorregut no obliga a enviar set missatges. Separar fases quan hi ha una decisió per prendre o un error per aturar. El cas de pantalla i les pràctiques segueixen aquest mateix fil. Aquesta explicació forma part dels dos minuts d’objectiu i recorregut del bloc A.","sources":[]},{"id":"s05","section":"A","title":"Abans de valorar una resposta","kind":"steps","items":[{"text":"Empresa i aplicació","reveal":1},{"text":"Model i mode","reveal":2},{"text":"Pla i compte","reveal":3}],"notes":"Obrir el selector del compte del centre i anotar model i mode. Les opcions canvien. En mode automàtic el model pot variar; seleccionar-lo manualment per comparar quan sigui possible. Les condicions de dades depenen del compte.","sources":[],"minutes":3},{"id":"s06","section":"B","title":"Un resultat es pot comprovar","kind":"compare","items":[{"text":"«Millora aquesta prova»","reveal":1},{"text":"Un full per preparar la reunió, amb criteris","reveal":2}],"notes":"Mostrar B1 sense generar res. Quin resultat es podria jutjar millor? Els retocs tenen sentit quan apunten a un criteri.","sources":[{"title":"LLMs Get Lost In Multi-Turn Conversation","url":"https://arxiv.org/abs/2505.06120"}],"promptCode":"B1","prompt":"«Millora aquesta prova.»\n\n«Prepara un full d'una pàgina per a la reunió en què l'equip valorarà la prova de comparació de fonts. Ha de permetre que cada docent hi aporti la seva experiència en deu minuts. Criteris: separa dades, interpretacions i preguntes obertes; inclou almenys una pregunta sobre què convé conservar; no proposis canvis abans d'escoltar l'equip. Treballa només amb els documents A i B. Conserva les xifres tal com hi apareixen. Pots decidir l'ordre i el format. Si falta una dada que canviaria el full, pregunta-la; si és menor, fes un supòsit i marca'l. Quan compleixis els criteris, entrega el full i indica què no has pogut comprovar.»","minutes":4},{"id":"s07","section":"B","title":"El contracte mínim","kind":"steps","items":[{"text":"Resultat i destinatari","reveal":1},{"text":"Criteri: cada pregunta es respon amb el text","reveal":2},{"text":"Invariant: conservar les xifres originals","reveal":3},{"text":"Llibertat, preguntes i condició d’aturada","reveal":4}],"notes":"Sis preguntes: resultat i per a qui; criteris; invariants; què pot decidir el model; quan ha de preguntar; quan s’ha d’aturar. Si falta una dada decisiva, preguntar; si és menor, marcar el supòsit.","sources":[],"minutes":4},{"id":"s08","section":"B","title":"Extensió, to i format","kind":"steps","items":[{"text":"Extensió en unitats d’ús: una pàgina","reveal":1},{"text":"To i format per a la persona destinatària","reveal":2},{"text":"Formular en positiu: paràgrafs breus","reveal":3}],"notes":"Indicar la mida en unitats d’ús: una pàgina, deu minuts o tres preguntes. Formular què ha de fer. Reservar les paraules absolutes per als invariants.","sources":[]},{"id":"s09","section":"B","title":"Que pregunti abans de proposar","kind":"steps","items":[{"text":"Una pregunta cada vegada","reveal":1},{"text":"Com a màxim quatre","reveal":2},{"text":"Acabar amb un encàrrec i els buits","reveal":3}],"notes":"Demostració B2: respondre una pregunta de manera incompleta i observar si la següent s’adapta. Demanar un pla de tres passos amb productes revisables.","sources":[{"title":"A Prompt Pattern Catalog","url":"https://arxiv.org/abs/2302.11382"}],"promptCode":"B2","prompt":"«Vull preparar la reunió de valoració de la prova, però encara tinc la idea a mitges. Entrevista'm per concretar-la. Fes les preguntes d'una en una i aprofita les respostes anteriors. Atura't quan sàpigues què s'ha de decidir, qui hi participa, amb quines dades comptem i com sabrem que la reunió ha servit; com a màxim, quatre preguntes. Després redacta l'encàrrec del full de preparació i assenyala els buits que encara importen.»","minutes":4},{"id":"s10","section":"B","title":"Una pregunta pot inclinar la resposta","kind":"compare","items":[{"text":"«Com fem més curta la prova?»","reveal":1},{"text":"«Quines dificultats són necessàries per observar el que volem i quines no?»","reveal":2}],"notes":"La primera pregunta pressuposa que la prova és llarga. Una impressió és una hipòtesi, no un acord.","sources":[]},{"id":"s11","section":"B","title":"Pràctica 1 · El vostre encàrrec","kind":"practice","items":[{"text":"Tres criteris observables","reveal":1},{"text":"Dos invariants","reveal":2},{"text":"Una parella revisa el contracte","reveal":3}],"notes":"Cinc minuts en parelles, sense enviar res al model. La parella veïna marca un criteri que no es pot comprovar i una condició que falta. Cas de reserva: Cas de reserva per a la pràctica · avisos de biblioteca \n     Avís A: «El taller de lectura es farà dimarts 3 de novembre, de 10 a 11 h. És gratuït. Hi ha dotze places. Cal reservar-les abans del 30 d'octubre. L'activitat es fa a la sala del primer pis; l'edifici no té ascensor.» \n     Avís B: «El taller de lectura es farà dijous 5 de novembre, de 16 a 17 h. Costa 4 euros. Hi ha dotze places. Es pot reservar fins al 2 de novembre. L'activitat es fa a la planta baixa i l'accés és sense esglaons.» \n     Encàrrec possible: una activitat de deu minuts perquè persones adultes triïn el taller segons una necessitat, amb tres preguntes i una pauta. Clau: per a qui només pot anar-hi a la tarda, B (de 16 a 17 h); per a qui no pot pujar escales, B; el nivell lector dels tallers no consta. Prova nova: posar el preu de B a zero; les respostes sobre horari i accés no han de canviar.","sources":[],"promptCode":"P","prompt":"«Vull obtenir [resultat] per a [destinatari i ús]. Ha de complir [2–4 criteris observables]. Treballa amb [fonts]. Conserva [invariants]. Pots decidir [detalls reversibles]. Pregunta'm només si falta [dada que canviaria el resultat]. Quan compleixis els criteris, entrega [format] i assenyala què queda pendent.»","minutes":5,"timerSeconds":300},{"id":"s12","section":"B","title":"Un format correcte és suficient?","kind":"statement","items":[{"text":"Tres apartats complets","reveal":1},{"text":"Falta comprovar si el contingut serveix","reveal":2}],"notes":"Pausa de comprovació de B. El format és una condició, no la prova que el contingut sigui adequat.","sources":[]},{"id":"s13","section":"C","title":"Capturar la reunió","kind":"workflow","items":[{"text":"Àudio → transcripció","reveal":1},{"text":"Text → notes","reveal":2},{"text":"Revisar cada transformació","reveal":3}],"notes":"Dues persones voluntàries llegeixen el diàleg fictici i es grava si hi consenten. Comparar text i àudio: negacions, xifres i noms. En una reunió real demanar consentiment, usar el compte del centre, substituir noms per rols i no aportar dades de l’alumnat. Diàleg per llegir i transcriure · S01–S07 \n     Els codis identifiquen segments, no persones, i els temps són ficticis: si es grava, substituir-los pels reals. \n     S01 [00:00] «La fitxa tenia vuit preguntes i havíem previst vint minuts. No vam cronometrar quant van trigar.» \n     S02 [00:15] «Jo vaig trigar vint-i-cinc minuts a corregir cinc fitxes; vaig fer servir les meves anotacions, no una pauta comuna.» \n     S03 [00:30] «Jo conservaria la comparació entre les dues fonts. Si la traiem, no podrem comprovar si localitzen la discrepància.» \n     S04 [00:45] «Podríem provar amb quatre preguntes i preparar abans una pauta. És una proposta per discutir.» \n     S05 [01:00] «Abans de canviar-la, prefereixo escoltar qui encara no ha parlat. No sabem per què van quedar sis fitxes incompletes.» \n     S06 [01:15] «Queda pendent decidir quantes preguntes. El que sí que acordem és recollir tres experiències docents més abans de la propera reunió.» \n     S07 [01:30] «No hem decidit qui les recollirà. Tampoc no hem decidit retirar la comparació de fonts.»","sources":[{"title":"Careless Whisper","url":"https://arxiv.org/abs/2402.08021"}],"minutes":4},{"id":"s14","section":"C","title":"Les notes no són una acta","kind":"steps","items":[{"text":"Observacions i objeccions","reveal":1},{"text":"Propostes i acords explícits","reveal":2},{"text":"Pendents amb el segment","reveal":3}],"notes":"Aplicar C1. S04 és proposta; S07 conserva les dues negacions. Un silenci no és un acord. Exemple: S04 → proposta, no aprovada: provar quatre preguntes i preparar una pauta.","sources":[],"promptCode":"C1","prompt":"«Ordena aquesta transcripció sense convertir-la en una acta. Separa observacions, propostes, objeccions, acords explícits i pendents. Per a cada punt, indica el segment (S01–S07). No inventis noms, dates ni responsables. Marca les negacions, les xifres i les paraules dubtoses que caldria comprovar a l'àudio. Un silenci no és un acord.»","minutes":4},{"id":"s15","section":"C","title":"Un exemple fa visible el criteri","kind":"evidence","items":[{"text":"S04 → proposta, no aprovada","reveal":1},{"text":"Provar quatre preguntes i preparar una pauta","reveal":2},{"text":"Comprovar el criteri amb un altre segment","reveal":3}],"notes":"Un exemple mostra el criteri de classificació. També pot encotillar la resposta: comprovar-lo amb un segment nou, per exemple S07, que conté dues negacions.","sources":[]},{"id":"s16","section":"C","title":"Notes en directe: esperar el final","kind":"steps","items":[{"text":"Desar cada bloc: N01, N02…","reveal":1},{"text":"Conservar contradiccions","reveal":2},{"text":"Ordenar en rebre «FI DE LES NOTES»","reveal":3}],"notes":"Els identificadors són estables, no marques temporals. No resumir ni proposar abans del senyal.","sources":[],"promptCode":"C2","prompt":"«Et passaré blocs de notes d'una reunió. Per ara, conserva el contingut i la procedència de cada bloc amb un identificador (N01, N02…). No en facis cap resum ni proposta. Si un bloc contradiu un altre, conserva'ls tots dos i marca el conflicte. Quan escrigui FI DE LES NOTES, ordena-ho tot en observacions, propostes, objeccions, acords i pendents.»"},{"id":"s17","section":"C","title":"Auditoria · primer, en parelles","kind":"quote","items":[{"text":"«El grup està d’acord a reduir la prova a quatre preguntes perquè vuit eren massa difícils. Tothom va trigar més de vint minuts. S’eliminarà la comparació de fonts. La Maria recollirà les experiències divendres.»","reveal":1}],"notes":"Tres minuts abans de consultar el model. Resum defectuós per auditar \n     «El grup està d'acord a reduir la prova a quatre preguntes perquè vuit eren massa difícils. Tothom va trigar més de vint minuts. S'eliminarà la comparació de fonts. La Maria recollirà les experiències divendres.» \n     La clau és al bloc C. Les afirmacions s'han redactat expressament amb errors per provar la revisió; no cal que el model en cometi cap. Diàleg: Diàleg per llegir i transcriure · S01–S07 \n     Els codis identifiquen segments, no persones, i els temps són ficticis: si es grava, substituir-los pels reals. \n     S01 [00:00] «La fitxa tenia vuit preguntes i havíem previst vint minuts. No vam cronometrar quant van trigar.» \n     S02 [00:15] «Jo vaig trigar vint-i-cinc minuts a corregir cinc fitxes; vaig fer servir les meves anotacions, no una pauta comuna.» \n     S03 [00:30] «Jo conservaria la comparació entre les dues fonts. Si la traiem, no podrem comprovar si localitzen la discrepància.» \n     S04 [00:45] «Podríem provar amb quatre preguntes i preparar abans una pauta. És una proposta per discutir.» \n     S05 [01:00] «Abans de canviar-la, prefereixo escoltar qui encara no ha parlat. No sabem per què van quedar sis fitxes incompletes.» \n     S06 [01:15] «Queda pendent decidir quantes preguntes. El que sí que acordem és recollir tres experiències docents més abans de la propera reunió.» \n     S07 [01:30] «No hem decidit qui les recollirà. Tampoc no hem decidit retirar la comparació de fonts.» El resum és defectuós expressament. El diàleg complet està disponible al full de materials per imprimir.","sources":[],"promptCode":"C3","prompt":"«Audita cada afirmació d'aquest resum amb els segments S01–S07. Etiqueta-la com a acreditada, contradita o no acreditada i cita el segment. Després redacta unes notes fidels de 120 paraules que conservin les propostes, les objeccions, l'acord que sí que hi ha i els pendents.»","minutes":7,"timerSeconds":180,"subtitle":"Resum fictici amb errors. Contrast amb S01–S07 · 3 minuts"},{"id":"s18","section":"C","title":"Una proposta no és un acord","kind":"evidence","items":[{"text":"S04 · Quatre preguntes: proposta","reveal":1},{"text":"S06 · Nombre de preguntes: pendent","reveal":2},{"text":"S01 · No es va cronometrar","reveal":3}],"notes":"Ni l’acord per reduir a quatre preguntes, ni la dificultat de vuit, ni que tothom trigués més de vint minuts estan acreditats.","sources":[]},{"id":"s19","section":"C","title":"Una objecció no desapareix","kind":"evidence","items":[{"text":"S03 · Conservar la comparació","reveal":1},{"text":"S07 · No s’ha decidit retirar-la","reveal":2},{"text":"S06 · Recollir tres experiències més","reveal":3},{"text":"S05 · Escoltar les veus pendents","reveal":4}],"notes":"S03 defensa la comparació. S07 nega la decisió de retirar-la i assenyala que no s’ha decidit qui recollirà les experiències. S06 recull l’acord de reunir-ne tres més; no consta Maria ni divendres. S05 reclama escoltar les persones que encara no han parlat i assenyala que no se sap per què sis fitxes van quedar incompletes.","sources":[]},{"id":"s20","section":"C","title":"Una cita ha de sostenir la conclusió","kind":"steps","items":[{"text":"El segment existeix?","reveal":1},{"text":"Sosté tota l’afirmació?","reveal":2},{"text":"Permet aquesta conclusió?","reveal":3}],"notes":"S01 només explica que no es va cronometrar. Una referència existent no garanteix que sostingui la conclusió.","sources":[]},{"id":"s21","section":"C","title":"Quan la hipòtesi entra al resum","kind":"compare","items":[{"text":"«Crec que és massa llarga»","reveal":1},{"text":"«Crec que la llargada és adequada»","reveal":2},{"text":"Versió neutra: hipòtesi i segments","reveal":3}],"notes":"Preparar les dues sortides abans amb les mateixes notes en xats temporals. Observar si canvien conclusions o només to; no atribuir cap resultat no observat. La versió neutra separa acords, propostes i incertesa.","sources":[],"promptCode":"C4","prompt":"«Crec que la prova és massa llarga. Amb aquestes notes, què en conclou l'equip?»\n\n«Crec que la llargada de la prova és adequada. Amb aquestes notes, què en conclou l'equip?»\n\nVersió neutra: «Amb aquestes notes, separa el que l'equip ha acordat, el que ha proposat i el que encara no sap. La meva impressió és que la prova és llarga: tracta-la com una hipòtesi i indica quins segments la sostenen i quins no.»","minutes":4},{"id":"s22","section":"C","title":"El denominador canvia la resposta","kind":"compare","items":[],"notes":"Segons el document A, tots dos percentatges responen a preguntes diferents. No hi ha dades sobre la causa de les sis fitxes incompletes. Document A · registre de la prova \n     Paràgraf 1: «A la sessió del 12 d'octubre hi havia 24 persones inscrites. N'hi van assistir 18. Es van recollir 12 fitxes completes. El registre no indica per què les altres sis persones assistents no van entregar una fitxa completa.» \n     Paràgraf 2: «La fitxa tenia vuit preguntes i estava prevista per a 20 minuts. No es va cronometrar quant es va trigar a fer-la. Una de les preguntes demanava comparar dues fonts que donaven xifres diferents. No es van guardar exemples de les respostes.» \n     Document B · notes de preparació \n     Paràgraf 1: «Una docent explica que va trigar 25 minuts a corregir cinc fitxes. No consta com les va triar ni quina pauta va fer servir. Un altre docent creu que una pauta comuna podria reduir el temps de correcció. No s'ha provat.» \n     Paràgraf 2: «La propera prova hauria de permetre observar si les persones distingeixen dada i interpretació i si localitzen una discrepància entre dos textos. L'equip encara ha d'acordar la durada i la pauta de correcció.»","sources":[],"columns":[{"title":"Assistents","items":["12 / 18 ≈ 67 %","Fitxes completes entre les persones que van assistir"]},{"title":"Inscripcions","items":["12 / 24 = 50 %","Fitxes completes entre les persones inscrites"]}],"subtitle":"Per què sis assistents no van entregar una fitxa completa? No consta."},{"id":"s23","section":"D","title":"Explorar abans de produir","kind":"table","items":[],"notes":"Comparar els tres camins amb criteris comuns: què permeten observar, temps de correcció, pèrdues i dada absent. Encara no redactar cap proposta. La taula és una pauta de comparació pendent d’omplir, no una avaluació ja feta. Cada fila aplica el mateix criteri als tres camins. No atribuir resultats a un model sense haver-los observat.","sources":[],"promptCode":"D1","prompt":"«Compara tres camins per a la prova: conservar-la tal com és, fer-hi un ajust mínim i redissenyar-la. Fes servir els mateixos criteris per a tots: què permet observar, temps de correcció, què es perdria i quina dada faltaria per decidir. Separa el que consta a les notes del que estimes tu. Encara no redactis cap proposta.»\n\n«Triem l'ajust mínim. Mantén els criteris i redacta fins a tres propostes. Per a cadascuna: segments que la motiven, què canvia, què es conserva, què es podria perdre i una prova petita per saber si funciona. No inventis acords, responsables ni terminis.»","minutes":4,"table":{"headers":["Criteri","Conservar","Ajust mínim","Redissenyar"],"rows":[["Què permet observar","Per valorar","Per valorar","Per valorar"],["Temps de correcció","Per estimar","Per estimar","Per estimar"],["Què es podria perdre","Per valorar","Per valorar","Per valorar"],["Dada que falta","Per identificar","Per identificar","Per identificar"]]},"subtitle":"Mateixos criteris per als tres camins. Encara cal contrastar-los."},{"id":"s24","section":"D","title":"Ara sí: elaborar propostes","kind":"steps","items":[{"text":"Segments que les motiven","reveal":1},{"text":"Què canvia i què es conserva","reveal":2},{"text":"Què es podria perdre i prova petita","reveal":3}],"notes":"Escollir l’ajust mínim i utilitzar la segona part de D1. Separar el que consta a les notes del que estima el model. No inventar acords, responsables ni terminis.","sources":[],"promptCode":"D1","prompt":"«Compara tres camins per a la prova: conservar-la tal com és, fer-hi un ajust mínim i redissenyar-la. Fes servir els mateixos criteris per a tots: què permet observar, temps de correcció, què es perdria i quina dada faltaria per decidir. Separa el que consta a les notes del que estimes tu. Encara no redactis cap proposta.»\n\n«Triem l'ajust mínim. Mantén els criteris i redacta fins a tres propostes. Per a cadascuna: segments que la motiven, què canvia, què es conserva, què es podria perdre i una prova petita per saber si funciona. No inventis acords, responsables ni terminis.»"},{"id":"s25","section":"D","title":"Comparar X i Y a cegues","kind":"practice","items":[{"text":"Mateix model i encàrrec","reveal":1},{"text":"Valorar amb els mateixos criteris","reveal":2},{"text":"Revelar el mode al final","reveal":3}],"notes":"Executar la segona part de D1 en mode ràpid i de raonament, o mostrar sortides preparades, amagant-ne l’origen. Una prova petita informa sobre aquesta tasca. Si només hi ha un model, comparar extreure xifres del document A amb valorar una proposta.","sources":[],"promptCode":"D2","prompt":"La segona part de D1 en un mode ràpid i en un de raonament, amb el model triat a mà. Copiar les dues sortides en un document com a X i Y, sense indicar-ne l'origen.","minutes":3},{"id":"s26","section":"D","title":"Pràctica 2 · De l’encàrrec a la prova","kind":"practice","items":[{"text":"Aclarir: fins a dues preguntes","reveal":1},{"text":"Produir el resultat","reveal":2},{"text":"Comprovar i corregir","reveal":3}],"notes":"Dotze minuts en parelles. Fer servir el contracte propi. Preguntar només si afecta el resultat; després produir. Comprovar un criteri amb evidència concreta i escriure una correcció que conservi el que funciona. Si la resposta ja és bona, identificar per què i comprovar-la.","sources":[],"promptCode":"P","prompt":"«Vull obtenir [resultat] per a [destinatari i ús]. Ha de complir [2–4 criteris observables]. Treballa amb [fonts]. Conserva [invariants]. Pots decidir [detalls reversibles]. Pregunta'm només si falta [dada que canviaria el resultat]. Quan compleixis els criteris, entrega [format] i assenyala què queda pendent.»","minutes":12,"timerSeconds":720},{"id":"s27","section":"D","title":"Una correcció que conserva","kind":"quote","items":[{"text":"«Conserva la comparació entre les dues fonts; simplifica només la consigna.»","reveal":1}],"notes":"El retorn específic informa què ha de sobreviure a la revisió. Després cal comprovar que s’ha conservat. No modifica els pesos del model.","sources":[]},{"id":"s28","section":"D","title":"Quatre peces per a la fita 1","kind":"steps","items":[{"text":"Contracte","reveal":1},{"text":"Pregunta o decisió de no preguntar","reveal":2},{"text":"Correcció i comprovació","reveal":3}],"notes":"Desar aquestes quatre peces amb la conversa. Si hi ha latència, treballar una parella en pantalla i preparar la comprovació en paper.","sources":[]},{"id":"s29","section":"E","title":"Quan la conversa es desvia","kind":"workflow","items":[{"text":"Consolidar el que importa","reveal":1},{"text":"Revisar el traspàs","reveal":2},{"text":"Continuar en un xat nou","reveal":3}],"notes":"Demanar E1; comprovar una decisió i un pendent. No convertir una proposta del model en decisió humana. Aportar de nou els documents i preguntar al xat nou amb quin material compta.","sources":[{"title":"LLMs Get Lost In Multi-Turn Conversation","url":"https://arxiv.org/abs/2505.06120"}],"promptCode":"E1","prompt":"«Prepara un traspàs perquè puguem continuar en una conversa nova: objectiu vigent, criteris, invariants, fonts, decisions confirmades, hipòtesis obertes, intents descartats amb el motiu i següent pas. Distingeix el que he decidit jo del que has proposat tu. Indica quins documents caldrà tornar a aportar.»","minutes":5},{"id":"s30","section":"E","title":"Què porta context a la conversa?","kind":"steps","items":[{"text":"Finestra de context","reveal":1},{"text":"Projecte i materials","reveal":2},{"text":"Memòria, xat temporal i cerca","reveal":3}],"notes":"La finestra és el volum tractable; el projecte agrupa materials segons l’eina; la memòria pot aportar dades d’altres converses. Un xat temporal limita l’ús de memòria segons el servei, però no anonimitza. Comprovar també les fonts recuperades.","sources":[]},{"id":"s31","section":"E","title":"Tres estats de tancament","kind":"steps","items":[{"text":"Llesta per provar","reveal":1},{"text":"Pendent d’una dada","reveal":2},{"text":"Pendent d’una decisió humana","reveal":3}],"notes":"El registre de decisions recull què s’ha decidit, evidència, qui ho ha confirmat i què resta pendent. Si no consta responsable o termini, escriure «sense assignar».","sources":[],"minutes":3},{"id":"s32","section":"E","title":"Abans de sortir","kind":"practice","items":[{"text":"El resultat que buscava era…","reveal":1},{"text":"He comprovat…","reveal":2},{"text":"La propera vegada canviaré…","reveal":3}],"notes":"Completar i desar les tres frases amb la conversa. Recollir dues aportacions i relacionar-les amb els problemes del començament.","sources":[],"minutes":3},{"id":"s33","section":"E","title":"Fita 1 · Preparar la continuació","kind":"steps","items":[{"text":"Necessitat, grup i resultat","reveal":1},{"text":"Mostra inicial i conversa d’avui","reveal":2},{"text":"Fonts de partida","reveal":3}],"notes":"Dues hores abans de la sessió 3: definir necessitat, grup i resultat; guardar la mostra inicial i la conversa; preparar les fonts per al quadern. El guió preveu la sessió 3 el 13 de novembre; confirmar la data. Avisar abans si no es pot accedir al compte del centre.","sources":[],"minutes":3},{"id":"s34","section":"Extra","title":"Adaptar el recorregut a la PAI","kind":"workflow","items":[{"text":"Substituir documents i notes pel cas real","reveal":1},{"text":"Conservar la possibilitat de no canviar","reveal":2},{"text":"Registrar només acords explícits","reveal":3}],"notes":"PAI: Prova d’Avaluació Inicial de GES. La impressió que és llarga o difícil de corregir és una hipòtesi d’Oscar pendent del professorat. Fer servir B1, B2, C2, C3, C4 neutre i D1. Recollir aportacions amb consentiment. Una objecció única mereix una fila pròpia.","sources":[],"optional":true},{"id":"s35","section":"Extra","title":"Provar un prompt amb casos nous","kind":"steps","items":[{"text":"Ajustar amb dos casos","reveal":1},{"text":"Comprovar amb dos casos nous","reveal":2},{"text":"Canviar una variable cada vegada","reveal":3}],"notes":"Laboratori sobre negacions: comprovar omissions i canvis de sentit en xats temporals amb el mateix model. El retorn desglossat per criteri és més útil que una nota global. Resultats de l’estudi limitats a les seves tasques.","sources":[{"title":"Reflective Prompt Optimization","url":"https://arxiv.org/abs/2610.12601"}],"optional":true},{"id":"s36","section":"Extra","title":"Rols i perspectives","kind":"statement","items":[{"text":"Una feina observable orienta la revisió","reveal":1}],"notes":"Exemple: «Revisa si una persona que no coneix l’activitat entendria la consigna». En estudis concrets, els rols d’expert no garanteixen exactitud; tres perspectives del mateix model no són tres experts independents.","sources":[{"title":"Playing Pretend","url":"https://arxiv.org/abs/2512.05858"}],"optional":true},{"section":"Extra","title":"Diversitat: variar el mecanisme","kind":"steps","items":[{"text":"Una opció convencional","reveal":1},{"text":"Una basada en una discrepància","reveal":2},{"text":"Una que comenci amb una decisió","reveal":3}],"notes":"Alternativa senzilla al Verbalized Sampling: variar eixos explícits. En l’estudi de Zhang i altres sobre escriptura creativa es va mesurar més diversitat amb tasques i models concrets. Les probabilitats expressades pel model no són probabilitats d’èxit de l’activitat.","sources":[{"title":"Verbalized Sampling","url":"https://arxiv.org/abs/2510.01171"}],"optional":true,"id":"s37"},{"section":"Extra","title":"Millorar el prompt amb un contrast","kind":"steps","items":[{"text":"Resultat: s’ha perdut una negació","reveal":1},{"text":"Canvi mínim: conservar les negacions","reveal":2},{"text":"Prova nova: «Encara no hem decidit la durada»","reveal":3}],"notes":"Metaprompt del banc: «Aquest era el meu prompt, aquest és el resultat i aquest és el criteri que ha fallat. Proposa el canvi mínim del prompt que ho pugui resoldre sense espatllar el que ja funciona. Després proposa un cas nou per comprovar si la millora es manté.» Per ajustar: «No traurem la comparació, però la pauta s’ha de revisar». Comprovar després amb el cas nou, no utilitzat per ajustar.","sources":[{"title":"GEPA","url":"https://arxiv.org/abs/2507.19457"}],"optional":true,"id":"s38"}]};</script><script>(()=>{
'use strict';
const slides=DECK_DATA.slides, stage=document.getElementById('stage'), $=id=>document.getElementById(id);
let index=0,step=0, timerId=null, remaining=0;
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n};
function revealNum(item,i){const n=Number(item.reveal);return item.reveal!=null&&Number.isFinite(n)?Math.max(0,n):i+1}
function makeSlide(s,i){
 const slide=el('section','slide '+(s.kind||'')); slide.id='slide-'+i; slide.setAttribute('aria-label',(i+1)+'. '+s.title);
 if(s.kind==='title')slide.classList.add('title-slide');
 const eyebrow=el('div','eyebrow',s.section==='Extra'?'Ampliació':('Bloc '+(s.section||'')));slide.append(eyebrow);
 slide.append(el(s.kind==='title'?'h1':'h2','',s.title));
 if(s.subtitle)slide.append(el('p','subtitle',s.subtitle));
 const body=el('div','body');
 if(s.quote)body.append(el('blockquote','',s.quote));
 if(s.items&&s.items.length){const list=el('ol','items');s.items.forEach((it,j)=>{const li=el('li','item');li.dataset.reveal=revealNum(it,j);if(it.label)li.append(el('span','label',it.label));const content=el('div','item-content');content.append(el('span','item-text',it.text||''));if(it.detail)content.append(el('span','detail',it.detail));li.append(content);list.append(li)});body.append(list)}
 if(s.columns&&s.columns.length){const cols=el('div','columns');s.columns.forEach((c,j)=>{const col=el('section','column');col.append(el('h3','',c.title));const list=el('ul');list.dataset.reveal=j+1;(c.items||[]).forEach(t=>list.append(el('li','',t)));col.append(list);cols.append(col)});body.append(cols)}
 if(s.table){const table=el('table'),head=el('thead'),hr=el('tr');(s.table.headers||[]).forEach(t=>hr.append(el('th','',t)));head.append(hr);table.append(head);const tbody=el('tbody');(s.table.rows||[]).forEach((row,j)=>{const tr=el('tr');tr.dataset.reveal=j+1;row.forEach(t=>tr.append(el('td','',t)));tbody.append(tr)});table.append(tbody);body.append(table)}
 if(s.prompt){const actions=el('div','actions');const open=el('button','action',s.promptCode?'Prompt '+s.promptCode:'Obrir prompt');open.type='button';open.addEventListener('click',()=>showPrompt(s));actions.append(open);body.append(actions)}
 if(s.timerSeconds){const actions=el('div','actions timer-controls');const display=el('span','timer',formatTime(s.timerSeconds));display.dataset.timer='';const start=el('button','action','Iniciar');start.dataset.start='';start.onclick=()=>toggleTimer(start,display);const reset=el('button','action','Reiniciar');reset.onclick=()=>resetTimer();actions.append(display,start,reset);body.append(actions)}
 slide.append(body);const foot=el('div','footer');foot.append(el('span','',DECK_DATA.title||'IA · Sessió 2'));const right=el('span');if(s.optional)right.append(el('span','optional','OPCIONAL · '));right.append(document.createTextNode((s.minutes?s.minutes+' min · ':'')+(i+1)+' / '+slides.length));foot.append(right);slide.append(foot);return slide
}
slides.forEach((s,i)=>stage.append(makeSlide(s,i)));
function maxStep(i=index){return Math.max(0,...Array.from(stage.children[i].querySelectorAll('[data-reveal]'),n=>Number(n.dataset.reveal)||0))}
function hash(){history.replaceState(null,'','#'+(index+1)+'/'+step)}
function render(updateHash=true){Array.from(stage.children).forEach((slide,i)=>{slide.classList.toggle('active',i===index);slide.setAttribute('aria-hidden',i===index?'false':'true');slide.querySelectorAll('[data-reveal]').forEach(n=>{const k=Number(n.dataset.reveal);n.classList.toggle('pending',k>step);n.classList.toggle('is-current',k===step&&step>0)})});$('position').textContent=(index+1)+' / '+slides.length+(maxStep()?' · '+step+'/'+maxStep():'');$('progress').style.width=((index+1)/slides.length*100)+'%';$('prev').disabled=index===0&&step===0;$('next').disabled=index===slides.length-1&&step===maxStep();if(updateHash)hash()}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function resetTimer(){stopTimer();remaining=Number(slides[index].timerSeconds)||0;const d=stage.children[index].querySelector('[data-timer]'),b=stage.children[index].querySelector('[data-start]');if(d)d.textContent=formatTime(remaining);if(b)b.textContent='Iniciar'}
function formatTime(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function toggleTimer(button,display){if(timerId){stopTimer();button.textContent='Continuar';return}if(remaining<=0)remaining=Number(slides[index].timerSeconds)||0;let end=Date.now()+remaining*1000;button.textContent='Pausar';timerId=setInterval(()=>{remaining=Math.max(0,Math.ceil((end-Date.now())/1000));display.textContent=formatTime(remaining);if(!remaining){stopTimer();button.textContent='Iniciar'}},250)}
function goTo(i,s=0){i=Math.max(0,Math.min(slides.length-1,Number(i)||0));if(i!==index){stopTimer();index=i;resetTimer()}step=Math.max(0,Math.min(maxStep(),Number(s)||0));render()}
function next(){if(step<maxStep())goTo(index,step+1);else if(index<slides.length-1)goTo(index+1,0)}
function prev(){if(step>0)goTo(index,step-1);else if(index>0)goTo(index-1,maxStep(index-1))}
function revealAll(){goTo(index,maxStep())}
async function copyText(value){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(value);else{const area=el('textarea');area.value=value;area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();const ok=document.execCommand('copy');area.remove();if(!ok)throw Error('copy')}toast('Prompt copiat')}catch(e){toast('No s’ha pogut copiar. Selecciona el text del prompt.')} }
let toastId;function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastId);toastId=setTimeout(()=>$('toast').classList.remove('show'),2200)}
function openDialog(d){if(!d.open)d.showModal()}
function promptParts(s,container,copyButton){
 const labels={B1:['Encàrrec vague','Contracte'],C4:['Hipòtesi: massa llarga','Hipòtesi: adequada','Versió neutra'],D1:['Explorar','Produir']};
 const parts=labels[s.promptCode]?(s.prompt||'').split(/\n\s*\n/):[];
 container.replaceChildren();
 if(parts.length===labels[s.promptCode]?.length){
  if(copyButton)copyButton.hidden=true;
  const intro={C4:'Cada variant, en un xat temporal diferent amb les mateixes notes.',D1:'Primer explorar. Produir després d’escollir.'}[s.promptCode];
  if(intro)container.append(el('p','',intro));
  parts.forEach((part,i)=>{const label=labels[s.promptCode][i],text=part.replace(/^Versió neutra:\s*/,'');container.append(el('h3','',label));container.append(el('pre','dialog-prompt',text));const b=el('button','action','Copiar: '+label);b.onclick=()=>copyText(text);container.append(b)});
 }else{container.append(el('pre','dialog-prompt',s.prompt||''));if(copyButton){copyButton.hidden=false;copyButton.onclick=()=>copyText(s.prompt||'')}else{const b=el('button','action','Copiar prompt');b.onclick=()=>copyText(s.prompt||'');container.append(b)}}
}
function showPrompt(s){$('promptTitle').textContent=s.promptCode?'Prompt '+s.promptCode:'Prompt';promptParts(s,$('promptText'),$('promptCopy'));openDialog($('promptDialog'))}
$('indexButton').onclick=()=>openDialog($('indexDialog'));$('notesButton').onclick=()=>{const s=slides[index], box=$('notesContent');box.replaceChildren(el('p','',s.notes||'Sense notes.'));if(s.prompt){box.append(el('h3','','Prompt '+(s.promptCode||'')));const promptBox=el('div');promptParts(s,promptBox,null);box.append(promptBox)}if(s.sources&&s.sources.length){box.append(el('h3','','Fonts'));const ul=el('ul');s.sources.forEach(source=>{const li=el('li'),a=el('a','',source.title||source.url);a.href=source.url;a.target='_blank';a.rel='noopener noreferrer';li.append(a);ul.append(li)});box.append(ul)}openDialog($('notesDialog'))};
$('helpButton').onclick=()=>openDialog($('helpDialog'));document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());$('prev').onclick=prev;$('next').onclick=next;
slides.forEach((s,i)=>{const b=el('button','',(i+1)+'. '+s.title+(s.optional?' · opcional':''));b.onclick=()=>{$('indexDialog').close();goTo(i)};$('indexList').append(b)});
function readHash(){const m=location.hash.match(/^#(\d+)(?:\/(\d+))?$/);if(m)goTo(Number(m[1])-1,Number(m[2]||0));else goTo(0,0)}
window.addEventListener('hashchange',readHash);
document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]'))return;if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;if(e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;const k=e.key.toLowerCase();if(k==='arrowright'||k===' '||k==='pagedown'){e.preventDefault();next()}else if(k==='arrowleft'||k==='pageup'){e.preventDefault();prev()}else if(k==='home'){e.preventDefault();goTo(0)}else if(k==='end'){e.preventDefault();goTo(slides.length-1)}else if(k==='r')goTo(index,0);else if(k==='i')$('indexButton').click();else if(k==='n')$('notesButton').click();else if(k==='?'||k==='h')$('helpButton').click();else if(k==='f'){if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()}});
window.deck={goTo,next,prev,revealAll,getState:()=>({index,step,maxStep:maxStep(),totalSteps:maxStep(),total:slides.length}),getSlides:()=>slides};
readHash();resetTimer();
})();


</script></body></html>
