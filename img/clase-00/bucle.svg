<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace">
  <title>El bucle de un modelo de lenguaje</title>
  <rect width="1200" height="430" fill="#030806"/>
  <defs>
    <marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffb224"/>
    </marker>
  </defs>

  <!-- las cuatro estaciones -->
  <g fill="#08120e" stroke="#34c873" stroke-width="2">
    <rect x="30" y="70" width="240" height="150"/>
    <rect x="330" y="70" width="240" height="150"/>
    <rect x="630" y="70" width="240" height="150" stroke="#ffb224" stroke-width="3"/>
    <rect x="930" y="70" width="240" height="150"/>
  </g>

  <g fill="#5dff9b" font-size="19" letter-spacing="1.500" text-anchor="middle">
    <text x="150" y="108">1 · EL TEXTO</text>
    <text x="450" y="108">2 · EN TROZOS</text>
    <text x="750" y="108" fill="#ffb224">3 · EL MODELO</text>
    <text x="1050" y="108">4 · UNA PALABRA</text>
  </g>

  <!-- 1: el texto -->
  <text x="150" y="165" fill="#dff5e8" font-size="26" text-anchor="middle">El gato duerme</text>
  <text x="150" y="198" fill="#dff5e8" font-size="26" text-anchor="middle">en la ▮</text>

  <!-- 2: los trozos -->
  <g font-size="21" text-anchor="middle">
    <g fill="none" stroke-width="1.500">
      <rect x="348" y="134" width="42" height="34" stroke="#34c873"/>
      <rect x="396" y="134" width="68" height="34" stroke="#ffb224"/>
      <rect x="470" y="134" width="84" height="34" stroke="#7fe6ff"/>
      <rect x="386" y="176" width="46" height="34" stroke="#a3c7b3"/>
      <rect x="438" y="176" width="46" height="34" stroke="#34c873"/>
    </g>
    <text x="369" y="158" fill="#5dff9b">El</text>
    <text x="430" y="158" fill="#ffb224">gato</text>
    <text x="512" y="158" fill="#7fe6ff">duerme</text>
    <text x="409" y="200" fill="#dff5e8">en</text>
    <text x="461" y="200" fill="#5dff9b">la</text>
  </g>

  <!-- 3: las apuestas del modelo -->
  <g font-size="20">
    <text x="650" y="150" fill="#dff5e8">nave</text>
    <rect x="730" y="135" width="118" height="16" fill="#5dff9b"/>
    <text x="650" y="178" fill="#a3c7b3">clase</text>
    <rect x="730" y="163" width="46" height="16" fill="#34c873"/>
    <text x="650" y="206" fill="#a3c7b3">bodega</text>
    <rect x="730" y="191" width="20" height="16" fill="#1c7a47"/>
  </g>

  <!-- 4: la elegida -->
  <text x="1050" y="176" fill="#ffb224" font-size="44" text-anchor="middle">nave</text>

  <!-- flechas de ida -->
  <g stroke="#ffb224" stroke-width="3" fill="none" marker-end="url(#punta)">
    <path d="M276 145H322"/>
    <path d="M576 145H622"/>
    <path d="M876 145H922"/>
  </g>

  <!-- la vuelta -->
  <path d="M1050 226V330H150V232" stroke="#ffb224" stroke-width="3" stroke-dasharray="10 8" fill="none" marker-end="url(#punta)"/>
  <rect x="330" y="310" width="540" height="40" fill="#030806"/>
  <text x="600" y="338" fill="#ffb224" font-size="22" letter-spacing="2" text-anchor="middle">SE AÑADE AL TEXTO · Y VUELTA A EMPEZAR</text>
  <text x="600" y="400" fill="#6a8c7a" font-size="18" letter-spacing="2" text-anchor="middle">LAS BARRAS SON PROBABILIDADES: CUÁNTO APUESTA EL MODELO POR CADA PALABRA</text>
</svg>
